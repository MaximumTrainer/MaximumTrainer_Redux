name: Build - Linux

on:
  workflow_call:
    inputs:
      tag_name:
        description: 'Release tag to embed as APP_VERSION (e.g. v1.2.3). Falls back to git describe when empty.'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to embed as APP_VERSION (e.g. v1.2.3). Falls back to git describe when empty.'
        required: false
        default: ''

env:
  QT_VERSION: '6.11.3'
  QWT_DIR: /tmp/qwt6
  # Retry/timeout tuning for aqtinstall (Qt CDN flakes). No-op in jobs that
  # install Qt without a checkout — aqt ignores a missing config file.
  AQT_CONFIG: ${{ github.workspace }}/.github/aqt-settings.ini

jobs:

  build_linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    permissions:
      contents: read

    steps:
    - name: checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Point apt at a reachable Ubuntu mirror
      # On 2026-11-11 the runners could not resolve any *.ubuntu.com host, and
      # apt's mirror+file method hangs ~30 min on DNS errors instead of falling
      # through. Use the first mirror that answers; cap timeouts so a dead
      # mirror fails fast. A mirror can resolve yet refuse connections (kernel.org,
      # 2026-11-13), so probe it with a real request before using it.
      run: |
        for host in mirrors.edge.kernel.org azure.archive.ubuntu.com archive.ubuntu.com; do
          if curl -fsS -o /dev/null -m 10 "http://$host/ubuntu/dists/jammy/Release"; then
            echo "Using http://$host/ubuntu/"
            echo "http://$host/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
            sudo grep -rl 'azure\.archive\.ubuntu\.com\|//archive\.ubuntu\.com\|//security\.ubuntu\.com' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null \
              | xargs -r sudo sed -i -E "s#https?://(azure\.archive|archive|security)\.ubuntu\.com/ubuntu/?#http://$host/ubuntu/#g" || true
            break
          fi
        done
        printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'desktop'
        arch: 'linux_gcc_64'
        modules: 'qtwebengine qtconnectivity qtwebchannel qtpositioning qtmultimedia qtwebsockets'
        cache: true
        cache-key-prefix: qt-linux

    - name: Install system dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          libusb-1.0-0-dev \
          libssl-dev \
          libgl1-mesa-dev \
          ninja-build \
          build-essential

    - name: Set up ccache
      uses: hendrikmuhs/ccache-action@v1.2.25
      with:
        key: linux-qt${{ env.QT_VERSION }}
        max-size: 400M
        evict-old-files: job
        job-summary: ccache stats

    - name: Restore QWT cache
      id: qwt-cache
      uses: actions/cache@v6
      with:
        path: ${{ env.QWT_DIR }}
        key: qwt-6.3.0-qt-${{ env.QT_VERSION }}-linux

    - name: Validate QWT cache
      id: qwt-validate
      # A corrupted cache extraction can leave a partial tree behind while the
      # action still reports a cache hit (seen on macOS: gtar errors mid
      # restore). Verify the pieces the build links against; rebuild otherwise.
      run: |
        if [ "${{ steps.qwt-cache.outputs.cache-hit }}" = "true" ] && \
           [ -e "$QWT_DIR/lib/libqwt.so.6" ] && \
           [ -f "$QWT_DIR/include/qwt_plot.h" ]; then
          echo "ok=true" >> "$GITHUB_OUTPUT"
        else
          echo "ok=false" >> "$GITHUB_OUTPUT"
          rm -rf "$QWT_DIR"
        fi

    - name: Build and install QWT
      # No QWT apt package exists for Qt6, so build 6.3.0 from source against the
      # installed Qt6 and stage it under QWT_DIR. CMake is pointed at it via
      # -DQWT_INSTALL=... .
      if: steps.qwt-validate.outputs.ok != 'true'
      run: |
        cd /tmp
        curl -L -o qwt.tar.bz2 "https://sourceforge.net/projects/qwt/files/qwt/6.3.0/qwt-6.3.0.tar.bz2/download"
        tar xf qwt.tar.bz2
        cd qwt-6.3.0
        qmake qwt.pro
        make -j$(nproc)
        make install INSTALL_ROOT=/tmp/qwt6-stage
        mkdir -p "$QWT_DIR"
        mv /tmp/qwt6-stage/usr/local/qwt-6.3.0/* "$QWT_DIR"/

    - name: Determine build version
      run: |
        if [ -n "${{ inputs.tag_name }}" ]; then
          GIT_TAG="${{ inputs.tag_name }}"
          echo "Using passed tag: $GIT_TAG"
        else
          GIT_TAG=$(git describe --tags --match 'v[0-9]*' --always | tr -d '\r' | sed 's/-[0-9]*-g[0-9a-f]*$//')
          [[ "$GIT_TAG" =~ ^[vV][0-9] ]] || GIT_TAG="v0.0.0"
          echo "Using git describe: $GIT_TAG"
        fi
        echo "GIT_TAG=$GIT_TAG" >> "$GITHUB_ENV"

    - name: Configure
      run: |
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
          -DQWT_INSTALL="$QWT_DIR" -DMT_WERROR=ON \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      env:
        INTERVALS_OAUTH_CLIENT_ID: ${{ secrets.INTERVALS_OAUTH_CLIENT_ID }}

    - name: Build app and test suites
      run: cmake --build build

    - name: Bundle QWT shared library into artifact
      # The test-runner jobs have no QWT installation. Carry the .so alongside
      # the binaries so the runtime jobs can find it via LD_LIBRARY_PATH=build/qwtlib
      # without depending on the QWT build cache.
      run: |
        mkdir -p build/qwtlib
        cp -P "$QWT_DIR"/lib/libqwt.so* build/qwtlib/

    - name: Upload artifact
      # Binaries only (no CMake tree or objects): the test and release jobs
      # only need these, and every one of them downloads this.
      uses: actions/upload-artifact@v7
      with:
        name: linux
        path: |
          build/release/
          build/tests/
          build/qwtlib/

  # ──────────────────────────────────────────────────────────────────────────
  # Unit & Service Test Suites (Linux) — consolidated (#352)
  #
  # All self-building suites share one runner and ONE Qt installation instead
  # of one job (= one Qt CDN download) per suite. Runs in parallel with
  # build_linux — none of these need the build artifact.
  #
  # Suites: logger, apptheme, intervals_icu (service / ZWO importer / DAO
  # bearer / OAuth exchange), strava + third-party services, credential_store,
  # config_bootstrap, settings, webengine_safe_mode,
  # history, and the live Intervals.icu integration suite
  # (uses secrets; QSKIPs gracefully without them).
  # ──────────────────────────────────────────────────────────────────────────
  test_unit_suites:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      INTERVALS_ICU_API_KEY:    ${{ secrets.INTERVALS_ICU_API_KEY }}
      INTERVALS_ICU_ATHLETE_ID: ${{ secrets.INTERVALS_ICU_ATHLETE_ID }}
      STRAVA_ACCESS_TOKEN:      ${{ secrets.STRAVA_ACCESS_TOKEN }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Point apt at a reachable Ubuntu mirror
      # On 2026-11-11 the runners could not resolve any *.ubuntu.com host, and
      # apt's mirror+file method hangs ~30 min on DNS errors instead of falling
      # through. Use the first mirror that answers; cap timeouts so a dead
      # mirror fails fast. A mirror can resolve yet refuse connections (kernel.org,
      # 2026-11-13), so probe it with a real request before using it.
      run: |
        for host in mirrors.edge.kernel.org azure.archive.ubuntu.com archive.ubuntu.com; do
          if curl -fsS -o /dev/null -m 10 "http://$host/ubuntu/dists/jammy/Release"; then
            echo "Using http://$host/ubuntu/"
            echo "http://$host/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
            sudo grep -rl 'azure\.archive\.ubuntu\.com\|//archive\.ubuntu\.com\|//security\.ubuntu\.com' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null \
              | xargs -r sudo sed -i -E "s#https?://(azure\.archive|archive|security)\.ubuntu\.com/ubuntu/?#http://$host/ubuntu/#g" || true
            break
          fi
        done
        printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'desktop'
        arch: 'linux_gcc_64'
        modules: 'qtwebsockets'
        cache: true
        cache-key-prefix: qt-linux

    - name: Install build dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y libssl-dev ninja-build

    - name: Set up ccache
      uses: hendrikmuhs/ccache-action@v1.2.25
      with:
        key: linux-unit-qt${{ env.QT_VERSION }}
        max-size: 400M
        evict-old-files: job
        job-summary: ccache stats

    - name: Build unit suites
      # Suites only (no app): this runner has no QWT/WebEngine/Bluetooth, so
      # the suites needing them are skipped here and run from build_linux.
      run: |
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMT_BUILD_APP=OFF \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        cmake --build build --target \
          logger_tests apptheme_tests intervals_icu_tests importer_workout_zwo_tests \
          intervals_icu_dao_bearer_tests intervals_icu_oauth_exchange_tests strava_tests \
          group_tests game_tests credential_store_tests config_bootstrap_tests settings_tests \
          webengine_safe_mode_tests history_tests studio_tests \
          intervals_icu_integration_tests

    - name: Run unit suites
      run: |
        ctest --test-dir build --output-on-failure -j"$(nproc)" -R '^(logger|apptheme|intervals_icu|importer_workout_zwo|intervals_icu_dao_bearer|intervals_icu_oauth_exchange|strava|group|game|credential_store|config_bootstrap|settings|webengine_safe_mode|history|studio)_tests$'

    - name: Run Intervals.icu live integration tests
      run: |
        # Live test against intervals.icu: retry transient network/API blips
        # before failing the job. -o writes results to a file we echo into the
        # log, so failures stay diagnosable even if stdout is buffered/lost.
        attempts=3
        for i in $(seq 1 $attempts); do
          echo "::group::Intervals.icu integration tests (attempt $i/$attempts)"
          code=0
          ./build/tests/intervals_icu_integration_tests -v2 -o results.txt,txt || code=$?
          if [ -f results.txt ]; then cat results.txt; fi
          echo "::endgroup::"
          if [ "$code" -eq 0 ]; then
            echo "Passed on attempt $i."
            exit 0
          fi
          echo "Attempt $i failed with exit code $code."
          if [ "$i" -lt "$attempts" ]; then sleep $((i * 15)); fi
        done
        echo "::error::Intervals.icu integration tests failed after $attempts attempts (likely a transient intervals.icu/network issue if no assertion appears above)."
        exit 1

  # ──────────────────────────────────────────────────────────────────────────
  # Headless Integration Tests (Linux) — consolidated (#352)
  #
  # Runs the pre-built headless test binaries from the build artifact with a
  # single Qt installation: BTLE unit + BLE API smoke, workout I/O, workout
  # creator, and workout parsing (secrets-gated live cases QSKIP without
  # credentials).
  # ──────────────────────────────────────────────────────────────────────────
  test_integration_headless:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    needs: build_linux
    permissions:
      contents: read
    env:
      INTERVALS_ICU_API_KEY:    ${{ secrets.INTERVALS_ICU_API_KEY }}
      INTERVALS_ICU_ATHLETE_ID: ${{ secrets.INTERVALS_ICU_ATHLETE_ID }}

    steps:
    - name: Point apt at a reachable Ubuntu mirror
      # On 2026-11-11 the runners could not resolve any *.ubuntu.com host, and
      # apt's mirror+file method hangs ~30 min on DNS errors instead of falling
      # through. Use the first mirror that answers; cap timeouts so a dead
      # mirror fails fast. A mirror can resolve yet refuse connections (kernel.org,
      # 2026-11-13), so probe it with a real request before using it.
      run: |
        for host in mirrors.edge.kernel.org azure.archive.ubuntu.com archive.ubuntu.com; do
          if curl -fsS -o /dev/null -m 10 "http://$host/ubuntu/dists/jammy/Release"; then
            echo "Using http://$host/ubuntu/"
            echo "http://$host/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
            sudo grep -rl 'azure\.archive\.ubuntu\.com\|//archive\.ubuntu\.com\|//security\.ubuntu\.com' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null \
              | xargs -r sudo sed -i -E "s#https?://(azure\.archive|archive|security)\.ubuntu\.com/ubuntu/?#http://$host/ubuntu/#g" || true
            break
          fi
        done
        printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts

    - name: Install Qt (with Bluetooth)
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'desktop'
        arch: 'linux_gcc_64'
        modules: 'qtconnectivity'
        cache: true
        cache-key-prefix: qt-linux

    - name: Install runtime dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          libfontconfig1 \
          libxrender1 \
          libxext6

    - name: Download build artifact
      uses: actions/download-artifact@v8
      with:
        name: linux
        path: build

    - name: Make test binaries executable
      run: |
        chmod +x build/tests/btle_tests \
                 build/tests/btle_api_tests \
                 build/tests/workout_io_tests \
                 build/tests/workout_creator_tests \
                 build/tests/workout_parsing_tests

    - name: BTLE unit tests
      run: ./build/tests/btle_tests -v2

    - name: BLE API smoke test
      run: ./build/tests/btle_api_tests -v2

    - name: Workout I/O tests
      run: |
        export LD_LIBRARY_PATH="$PWD/build/qwtlib:$LD_LIBRARY_PATH"
        QT_QPA_PLATFORM=offscreen ./build/tests/workout_io_tests -v2

    - name: Workout creator tests
      run: ./build/tests/workout_creator_tests -v2

    - name: Workout parsing tests
      run: ./build/tests/workout_parsing_tests -v2

  # ──────────────────────────────────────────────────────────────────────────
  # GUI Integration Tests (Linux, Xvfb) — consolidated (#352)
  #
  # Runs the pre-built windowed test binaries under one Xvfb display with a
  # single Qt installation: BTLE integration, runtime validation, offline
  # mode, UI screens, and UI navigation (which launches the real
  # MaximumTrainer binary). Screenshot evidence from every suite is uploaded
  # as one artifact.
  # ──────────────────────────────────────────────────────────────────────────
  test_gui:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    needs: build_linux
    permissions:
      contents: read

    steps:
    - name: Checkout scripts
      uses: actions/checkout@v7
      with:
        sparse-checkout: scripts

    - name: Point apt at a reachable Ubuntu mirror
      # On 2026-11-11 the runners could not resolve any *.ubuntu.com host, and
      # apt's mirror+file method hangs ~30 min on DNS errors instead of falling
      # through. Use the first mirror that answers; cap timeouts so a dead
      # mirror fails fast. A mirror can resolve yet refuse connections (kernel.org,
      # 2026-11-13), so probe it with a real request before using it.
      run: |
        for host in mirrors.edge.kernel.org azure.archive.ubuntu.com archive.ubuntu.com; do
          if curl -fsS -o /dev/null -m 10 "http://$host/ubuntu/dists/jammy/Release"; then
            echo "Using http://$host/ubuntu/"
            echo "http://$host/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
            sudo grep -rl 'azure\.archive\.ubuntu\.com\|//archive\.ubuntu\.com\|//security\.ubuntu\.com' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null \
              | xargs -r sudo sed -i -E "s#https?://(azure\.archive|archive|security)\.ubuntu\.com/ubuntu/?#http://$host/ubuntu/#g" || true
            break
          fi
        done
        printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts

    - name: Install Qt (full app modules)
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'desktop'
        arch: 'linux_gcc_64'
        modules: 'qtwebengine qtconnectivity qtwebchannel qtpositioning qtmultimedia qtwebsockets'
        cache: true
        cache-key-prefix: qt-linux

    - name: Install X11 runtime dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          xvfb \
          libxcb-cursor0 \
          libfontconfig1 \
          libxrender1 \
          libxext6 \
          libgl1-mesa-dev \
          libnss3 \
          libxcomposite1 \
          libxdamage1 \
          libxrandr2 \
          libxkbcommon0 \
          libasound2

    - name: Download build artifact
      uses: actions/download-artifact@v8
      with:
        name: linux
        path: build

    - name: Make binaries executable
      run: |
        chmod +x build/tests/btle_integration_tests \
                 build/tests/runtime_validation_tests \
                 build/tests/offline_mode_tests \
                 build/tests/ui_screens_tests \
                 build/tests/ui_navigation_tests \
                 build/release/MaximumTrainer

    - name: Start Xvfb
      run: |
        Xvfb :99 -screen 0 1280x800x24 &
        sleep 1
        echo "DISPLAY=:99" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$PWD/build/qwtlib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

    - name: BTLE integration test
      run: ./build/tests/btle_integration_tests -v2

    - name: Runtime validation test
      run: ./build/tests/runtime_validation_tests -v2

    - name: Offline mode test
      run: ./build/tests/offline_mode_tests -v2

    - name: UI screens test
      run: ./build/tests/ui_screens_tests -v2

    - name: UI navigation tests
      # MT_NO_NETWORK=1 disables all outbound network calls in the launched
      # MaximumTrainer binary (radio list, session check, Intervals.icu, etc.).
      # The child process inherits this variable from QProcess automatically.
      env:
        MT_NO_NETWORK: "1"
      run: ./build/tests/ui_navigation_tests -v2

    - name: Startup smoke test - first run, clean profile (#377)
      run: scripts/startup-smoke.sh build/release/MaximumTrainer first

    - name: Startup smoke test - second run (#377)
      run: scripts/startup-smoke.sh build/release/MaximumTrainer second

    - name: Collect startup log
      if: always()
      run: cp "$HOME/.local/share/MaximumTrainer/MaximumTrainer_Redux/MaximumTrainer.log" build/tests/startup-linux.log || true

    - name: Upload GUI test evidence
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: gui-test-artifacts-linux
        path: |
          build/tests/startup-linux.log
          build/tests/btle_integration_screenshot.png
          build/tests/screenshot-linux-*.png
          build/tests/offline-mode-linux-*.png
          build/tests/activity-linux-*.tsv
          build/tests/ui-screens-*.png
          build/tests/app-journey-*/

  # ──────────────────────────────────────────────────────────────────────────
  # Live GUI Tests (Linux, Xvfb + Intervals.icu secrets) — consolidated (#352)
  #
  # The three suites that talk to the live intervals.icu API from a windowed
  # session: online mode, workout UI, and the login screen full-application
  # journey. Kept separate from test_gui so a flaky live run retries cheaply.
  # Tests QSKIP gracefully when the secrets are absent (fork PRs).
  # ──────────────────────────────────────────────────────────────────────────
  test_gui_live:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    needs: build_linux
    permissions:
      contents: read
    env:
      INTERVALS_ICU_API_KEY:    ${{ secrets.INTERVALS_ICU_API_KEY }}
      INTERVALS_ICU_ATHLETE_ID: ${{ secrets.INTERVALS_ICU_ATHLETE_ID }}

    steps:
    - name: Point apt at a reachable Ubuntu mirror
      # On 2026-11-11 the runners could not resolve any *.ubuntu.com host, and
      # apt's mirror+file method hangs ~30 min on DNS errors instead of falling
      # through. Use the first mirror that answers; cap timeouts so a dead
      # mirror fails fast. A mirror can resolve yet refuse connections (kernel.org,
      # 2026-11-13), so probe it with a real request before using it.
      run: |
        for host in mirrors.edge.kernel.org azure.archive.ubuntu.com archive.ubuntu.com; do
          if curl -fsS -o /dev/null -m 10 "http://$host/ubuntu/dists/jammy/Release"; then
            echo "Using http://$host/ubuntu/"
            echo "http://$host/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
            sudo grep -rl 'azure\.archive\.ubuntu\.com\|//archive\.ubuntu\.com\|//security\.ubuntu\.com' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null \
              | xargs -r sudo sed -i -E "s#https?://(azure\.archive|archive|security)\.ubuntu\.com/ubuntu/?#http://$host/ubuntu/#g" || true
            break
          fi
        done
        printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts

    - name: Install Qt (with WebEngine + Bluetooth)
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'desktop'
        arch: 'linux_gcc_64'
        modules: 'qtwebengine qtconnectivity qtwebchannel qtpositioning qtwebsockets'
        cache: true
        cache-key-prefix: qt-linux

    - name: Install X11 runtime dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          xvfb \
          libxcb-cursor0 \
          libfontconfig1 \
          libxrender1 \
          libxext6 \
          libgl1-mesa-dev \
          libnss3 \
          libxcomposite1 \
          libxdamage1 \
          libxrandr2 \
          libxkbcommon0 \
          libasound2

    - name: Download build artifact
      uses: actions/download-artifact@v8
      with:
        name: linux
        path: build

    - name: Make test binaries executable
      run: |
        chmod +x build/tests/online_mode_tests \
                 build/tests/workout_ui_tests \
                 build/tests/login_screen_tests

    - name: Start Xvfb
      run: |
        Xvfb :99 -screen 0 1280x800x24 &
        sleep 1
        echo "DISPLAY=:99" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$PWD/build/qwtlib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

    - name: Online mode authentication test
      run: ./build/tests/online_mode_tests -v2

    - name: Workout UI test
      run: ./build/tests/workout_ui_tests -v2

    - name: Login screen test
      run: ./build/tests/login_screen_tests -v2

    - name: Upload live GUI test evidence
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: gui-live-test-artifacts-linux
        path: |
          build/tests/online-mode-linux-*.png
          build/tests/workout-ui-linux-*.png
          build/tests/*-linux-*.png
