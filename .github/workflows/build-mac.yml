name: Build - macOS

on:
  workflow_call:
    inputs:
      tag_name:
        description: 'Release tag to embed as APP_VERSION (e.g. v1.2.3). Falls back to git describe when empty.'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to embed as APP_VERSION (e.g. v1.2.3). Falls back to git describe when empty.'
        required: false
        default: ''

env:
  # Retry/timeout tuning for aqtinstall (Qt CDN flakes). No-op in jobs that
  # install Qt without a checkout — aqt ignores a missing config file.
  AQT_CONFIG: ${{ github.workspace }}/.github/aqt-settings.ini

jobs:

  build_mac:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
    - name: checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.11.1'
        host: 'mac'
        target: 'desktop'
        arch: 'clang_64'
        modules: 'qtwebengine qtconnectivity qtwebchannel qtpositioning qtmultimedia'
        cache: true
        cache-key-prefix: qt-mac

    - name: Install OpenSSL
      run: brew install openssl@3

    - name: Restore QWT cache
      id: qwt-cache
      uses: actions/cache@v4
      with:
        # Cache only the directories needed to compile and link against QWT.
        # Excluding qwt-6.3.0/doc avoids a gtar extraction failure on macOS
        # runners where that subtree contains paths that confuse GNU tar.
        path: |
          /usr/local/qwt-6.3.0/lib
          /usr/local/qwt-6.3.0/include
          /usr/local/qwt-6.3.0/features
          /usr/local/qwt-6.3.0/mkspecs
        key: qwt-6.3.0-qt-6.11.1-macos-nodoc

    - name: Build and install QWT
      if: steps.qwt-cache.outputs.cache-hit != 'true'
      run: |
        # Remove any pre-installed Homebrew qwt that could shadow our headers
        brew uninstall qwt --force --ignore-dependencies 2>/dev/null || true
        cd /tmp
        curl -L -o qwt.tar.bz2 "https://sourceforge.net/projects/qwt/files/qwt/6.3.0/qwt-6.3.0.tar.bz2/download"
        tar -xjf qwt.tar.bz2
        cd qwt-6.3.0
        sed -i.bak 's/QwtFramework//' qwtconfig.pri
        qmake qwt.pro
        make -j$(sysctl -n hw.logicalcpu)
        sudo make install

    - name: Fix QWT install_name for macdeployqt compatibility
      # QWT 6.3.0 default LC_ID_DYLIB is /usr/lib/libqwt.6.dylib but the actual
      # file is at /usr/local/qwt-6.3.0/lib/.  macdeployqt resolves dependencies
      # by following LC_ID_DYLIB, so it errors "no file at /usr/lib/..." if the
      # install_name is wrong.  Fix it before the app is linked so the app binary's
      # LC_LOAD_DYLIB also records the correct path.
      run: |
        QWT_LIB=/usr/local/qwt-6.3.0/lib/libqwt.6.dylib
        sudo install_name_tool -id "$QWT_LIB" "$QWT_LIB"
        echo "QWT install_name: $(otool -D $QWT_LIB | tail -1)"

    - name: Determine build version
      run: |
        if [ -n "${{ inputs.tag_name }}" ]; then
          GIT_TAG="${{ inputs.tag_name }}"
          echo "Using passed tag: $GIT_TAG"
        else
          GIT_TAG=$(git describe --tags --match 'v[0-9]*' --always | tr -d '\r' | sed 's/-[0-9]*-g[0-9a-f]*$//')
          [[ "$GIT_TAG" =~ ^[vV][0-9] ]] || GIT_TAG="v0.0.0"
          echo "Using git describe: $GIT_TAG"
        fi
        echo "Build version: $GIT_TAG"
        echo "GIT_TAG=$GIT_TAG" >> "$GITHUB_ENV"

    - name: Create Makefile
      run: |
        qmake MaximumTrainer.pro \
          "QWT_INSTALL=/usr/local/qwt-6.3.0"
      env:
        INTERVALS_OAUTH_CLIENT_ID: ${{ secrets.INTERVALS_OAUTH_CLIENT_ID }}

    - name: Diagnose QWT installation
      run: |
        echo "=== All qwt_plot.h on system ==="
        find /opt/homebrew /usr/local -name "qwt_plot.h" 2>/dev/null || true
        echo "=== Installed qwtconfig.pri ==="
        cat /usr/local/qwt-6.3.0/features/qwtconfig.pri 2>/dev/null || true

    - name: Run MakeFile
      run: make -j$(sysctl -n hw.logicalcpu)

    - name: Build runtime validation test
      run: |
        mkdir -p build/tests
        cd tests/integration
        qmake runtime_validation_tests.pro
        make -j$(sysctl -n hw.logicalcpu)

    - name: Build offline mode test
      run: |
        mkdir -p build/tests
        cd tests/integration
        qmake offline_mode_tests.pro
        make -j$(sysctl -n hw.logicalcpu)

    - name: Build BLE API smoke test
      run: |
        mkdir -p build/tests
        cd tests/integration
        qmake btle_api_tests.pro
        make -j$(sysctl -n hw.logicalcpu)

    - name: Build online mode test
      run: |
        mkdir -p build/tests
        cd tests/integration
        qmake online_mode_tests.pro \
          QMAKE_LFLAGS+="-L$(brew --prefix openssl@3)/lib" \
          QMAKE_CXXFLAGS+="-I$(brew --prefix openssl@3)/include"
        make -j$(sysctl -n hw.logicalcpu)

    - name: Build login screen test
      run: |
        mkdir -p build/tests
        cd tests/integration
        qmake login_screen_tests.pro "QWT_INSTALL=/usr/local/qwt-6.3.0"
        make -j$(sysctl -n hw.logicalcpu)

    - name: Build workout UI test
      run: |
        mkdir -p build/tests
        cd tests/integration
        qmake workout_ui_tests.pro "QWT_INSTALL=/usr/local/qwt-6.3.0" \
          QMAKE_LFLAGS+="-L$(brew --prefix openssl@3)/lib" \
          QMAKE_CXXFLAGS+="-I$(brew --prefix openssl@3)/include"
        make -j$(sysctl -n hw.logicalcpu)

    - name: Build workout parsing test
      run: |
        mkdir -p build/tests
        cd tests/integration
        qmake workout_parsing_tests.pro \
          QMAKE_LFLAGS+="-L$(brew --prefix openssl@3)/lib" \
          QMAKE_CXXFLAGS+="-I$(brew --prefix openssl@3)/include"
        make -j$(sysctl -n hw.logicalcpu)

    - name: Build UI navigation test
      run: |
        mkdir -p build/tests
        cd tests/integration
        qmake ui_navigation_tests.pro "QWT_INSTALL=/usr/local/qwt-6.3.0" \
          QMAKE_LFLAGS+="-L$(brew --prefix openssl@3)/lib" \
          QMAKE_CXXFLAGS+="-I$(brew --prefix openssl@3)/include"
        make -j$(sysctl -n hw.logicalcpu)

    - name: Build UI screens test
      run: |
        mkdir -p build/tests
        cd tests/integration
        qmake ui_screens_tests.pro "QWT_INSTALL=/usr/local/qwt-6.3.0"
        make -j$(sysctl -n hw.logicalcpu)

    - name: Build workout I/O test
      run: |
        mkdir -p build/tests
        cd tests/integration
        qmake workout_io_tests.pro "QWT_INSTALL=/usr/local/qwt-6.3.0"
        make -j$(sysctl -n hw.logicalcpu)

    - name: Build workout creator test
      run: |
        mkdir -p build/tests
        cd tests/integration
        qmake workout_creator_tests.pro
        make -j$(sysctl -n hw.logicalcpu)

    - name: Bundle QWT dylib into test artifact
      # The test runner job has no QWT installation. Copy the dylib next to the
      # binary and rewrite its LC_LOAD_DYLIB to @loader_path so dyld finds it
      # from the artifact without needing the absolute /usr/local path.
      # MaximumTrainer.app is also bundled so that testFullApplicationJourney()
      # can launch the real application without needing QWT installed on the runner.
      run: |
        cp /usr/local/qwt-6.3.0/lib/libqwt.6.dylib build/tests/
        install_name_tool \
          -change /usr/local/qwt-6.3.0/lib/libqwt.6.dylib \
          @loader_path/libqwt.6.dylib \
          build/tests/login_screen_tests
        install_name_tool \
          -change /usr/local/qwt-6.3.0/lib/libqwt.6.dylib \
          @loader_path/libqwt.6.dylib \
          build/tests/workout_ui_tests
        install_name_tool \
          -change /usr/local/qwt-6.3.0/lib/libqwt.6.dylib \
          @loader_path/libqwt.6.dylib \
          build/tests/ui_navigation_tests
        for bin in ui_screens_tests workout_io_tests; do
          if [ -f "build/tests/$bin" ]; then
            install_name_tool \
              -change /usr/local/qwt-6.3.0/lib/libqwt.6.dylib \
              @loader_path/libqwt.6.dylib \
              "build/tests/$bin"
          fi
        done
        # Bundle the dylib into the app bundle so the test runner does not
        # need a QWT installation to launch MaximumTrainer.app.
        # Guard: verify the app binary exists before attempting to patch it.
        test -f build/release/MaximumTrainer.app/Contents/MacOS/MaximumTrainer
        mkdir -p build/release/MaximumTrainer.app/Contents/MacOS
        cp /usr/local/qwt-6.3.0/lib/libqwt.6.dylib \
           build/release/MaximumTrainer.app/Contents/MacOS/
        install_name_tool \
          -change /usr/local/qwt-6.3.0/lib/libqwt.6.dylib \
          @loader_path/libqwt.6.dylib \
          build/release/MaximumTrainer.app/Contents/MacOS/MaximumTrainer

    - name: Bind rpath for Qt frameworks and OpenSSL
      run: |
        install_name_tool -add_rpath /usr/local/lib build/release/MaximumTrainer.app/Contents/MacOS/MaximumTrainer
        install_name_tool -add_rpath $(brew --prefix openssl@3)/lib build/release/MaximumTrainer.app/Contents/MacOS/MaximumTrainer
        install_name_tool -add_rpath $(brew --prefix openssl@3)/lib build/tests/online_mode_tests
        install_name_tool -add_rpath $(brew --prefix openssl@3)/lib build/tests/workout_ui_tests
        install_name_tool -add_rpath $(brew --prefix openssl@3)/lib build/tests/workout_parsing_tests
        install_name_tool -add_rpath $(brew --prefix openssl@3)/lib build/tests/ui_navigation_tests

    - name: upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: macos
        path: build/

  # ──────────────────────────────────────────────────────────────────────────
  # Headless Test Suites (macOS) — consolidated (#352)
  #
  # One runner and ONE Qt installation for every suite that needs no window:
  # BLE API smoke, workout I/O, workout creator, workout parsing
  # (secrets-gated cases QSKIP without credentials), and the self-built live
  # Intervals.icu integration suite.
  # ──────────────────────────────────────────────────────────────────────────
  test_headless_suites:
    runs-on: macos-latest
    needs: build_mac
    permissions:
      contents: read
    env:
      INTERVALS_ICU_API_KEY:    ${{ secrets.INTERVALS_ICU_API_KEY }}
      INTERVALS_ICU_ATHLETE_ID: ${{ secrets.INTERVALS_ICU_ATHLETE_ID }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Qt (with Bluetooth)
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.11.1'
        host: 'mac'
        target: 'desktop'
        arch: 'clang_64'
        modules: 'qtconnectivity'
        cache: true
        cache-key-prefix: qt-mac

    - name: Install OpenSSL
      run: brew install openssl@3

    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: macos
        path: build

    - name: Make test binaries executable
      run: |
        chmod +x build/tests/btle_api_tests \
                 build/tests/workout_io_tests \
                 build/tests/workout_creator_tests \
                 build/tests/workout_parsing_tests

    - name: BLE API smoke test
      run: ./build/tests/btle_api_tests -v2

    - name: Workout I/O tests
      run: ./build/tests/workout_io_tests -v2

    - name: Workout creator tests
      run: ./build/tests/workout_creator_tests -v2

    - name: Workout parsing tests
      run: ./build/tests/workout_parsing_tests -v2

    - name: Build Intervals.icu live integration tests
      run: |
        mkdir -p build/tests
        cd tests/intervals_icu_integration
        qmake intervals_icu_integration_tests.pro \
          QMAKE_LFLAGS+="-L$(brew --prefix openssl@3)/lib" \
          QMAKE_CXXFLAGS+="-I$(brew --prefix openssl@3)/include"
        make -j$(sysctl -n hw.logicalcpu)

    - name: Run Intervals.icu live integration tests
      run: |
        # Live test against intervals.icu: retry transient network/API blips
        # before failing the job. -o writes results to a file we echo into the
        # log, so failures stay diagnosable even if stdout is buffered/lost.
        attempts=3
        for i in $(seq 1 $attempts); do
          echo "::group::Intervals.icu integration tests (attempt $i/$attempts)"
          code=0
          ./build/tests/intervals_icu_integration_tests -v2 -o results.txt,txt || code=$?
          if [ -f results.txt ]; then cat results.txt; fi
          echo "::endgroup::"
          if [ "$code" -eq 0 ]; then
            echo "Passed on attempt $i."
            exit 0
          fi
          echo "Attempt $i failed with exit code $code."
          if [ "$i" -lt "$attempts" ]; then sleep $((i * 15)); fi
        done
        echo "::error::Intervals.icu integration tests failed after $attempts attempts (likely a transient intervals.icu/network issue if no assertion appears above)."
        exit 1

  # ──────────────────────────────────────────────────────────────────────────
  # GUI Integration Tests (macOS) — consolidated (#352)
  #
  # One runner and ONE Qt installation for the windowed suites that need no
  # secrets: runtime validation, offline mode, UI screens, and UI navigation
  # (which launches the real MaximumTrainer.app). Screenshot evidence from
  # every suite is uploaded as one artifact.
  # ──────────────────────────────────────────────────────────────────────────
  test_gui:
    runs-on: macos-latest
    needs: build_mac
    permissions:
      contents: read

    steps:
    - name: Install Qt (full app modules)
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.11.1'
        host: 'mac'
        target: 'desktop'
        arch: 'clang_64'
        modules: 'qtwebengine qtconnectivity qtwebchannel qtpositioning qtmultimedia'
        cache: true
        cache-key-prefix: qt-mac

    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: macos
        path: build

    - name: Make binaries executable
      run: |
        chmod +x build/tests/runtime_validation_tests \
                 build/tests/offline_mode_tests \
                 build/tests/ui_screens_tests \
                 build/tests/ui_navigation_tests \
                 build/release/MaximumTrainer.app/Contents/MacOS/MaximumTrainer

    - name: Runtime validation test
      run: ./build/tests/runtime_validation_tests -v2

    - name: Offline mode test
      run: ./build/tests/offline_mode_tests -v2

    - name: UI screens test
      run: ./build/tests/ui_screens_tests -v2

    - name: UI navigation tests
      # MT_NO_NETWORK=1 disables all outbound network calls in the launched
      # MaximumTrainer binary (radio list, session check, Intervals.icu, etc.).
      # The child process inherits this variable from QProcess automatically.
      env:
        MT_NO_NETWORK: "1"
      run: ./build/tests/ui_navigation_tests -v2

    - name: Upload GUI test evidence
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: gui-test-artifacts-macos
        path: |
          build/tests/screenshot-macos-*.png
          build/tests/offline-mode-macos-*.png
          build/tests/activity-macos-*.tsv
          build/tests/ui-screens-*.png
          build/tests/app-journey-*/

  # ──────────────────────────────────────────────────────────────────────────
  # Live GUI Tests (macOS + Intervals.icu secrets) — consolidated (#352)
  #
  # The three windowed suites that talk to the live intervals.icu API: online
  # mode, workout UI, and the login screen full-application journey. Kept
  # separate from test_gui so a flaky live run retries cheaply. Tests QSKIP
  # gracefully when the secrets are absent (fork PRs).
  # ──────────────────────────────────────────────────────────────────────────
  test_gui_live:
    runs-on: macos-latest
    needs: build_mac
    permissions:
      contents: read
    env:
      INTERVALS_ICU_API_KEY:    ${{ secrets.INTERVALS_ICU_API_KEY }}
      INTERVALS_ICU_ATHLETE_ID: ${{ secrets.INTERVALS_ICU_ATHLETE_ID }}

    steps:
    - name: Install Qt (with WebEngine + Bluetooth)
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.11.1'
        host: 'mac'
        target: 'desktop'
        arch: 'clang_64'
        modules: 'qtwebengine qtconnectivity qtwebchannel qtpositioning'
        cache: true
        cache-key-prefix: qt-mac

    - name: Install OpenSSL
      run: brew install openssl@3

    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: macos
        path: build

    - name: Make test binaries executable
      run: |
        chmod +x build/tests/online_mode_tests \
                 build/tests/workout_ui_tests \
                 build/tests/login_screen_tests

    - name: Online mode authentication test
      run: ./build/tests/online_mode_tests -v2

    - name: Workout UI test
      run: ./build/tests/workout_ui_tests -v2

    - name: Login screen test
      run: ./build/tests/login_screen_tests -v2

    - name: Upload live GUI test evidence
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: gui-live-test-artifacts-macos
        path: |
          build/tests/online-mode-macos-*.png
          build/tests/workout-ui-macos-*.png
          build/tests/*-macos-*.png
