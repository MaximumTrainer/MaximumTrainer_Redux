name: Deploy intervals-cors-proxy Worker

on:
  push:
    branches: [master]
    paths:
      - 'workers/intervals-cors-proxy/**'
  workflow_dispatch:
  # Callable by proxy-healthcheck.yml to auto-redeploy if the proxy is ever
  # found clobbered (secrets: inherit passes the caller's Cloudflare secrets).
  workflow_call:

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy worker
        id: deploy
        working-directory: workers/intervals-cors-proxy
        # --config pinned defensively: the repo-root wrangler config that
        # wrangler v4 could otherwise resolve and deploy over this proxy was
        # removed to stop the clobber (#279/#284). Pin kept as belt-and-braces.
        run: |
          DEPLOY_OUTPUT=$(npx wrangler deploy --config wrangler.toml 2>&1)
          echo "$DEPLOY_OUTPUT"
          WORKER_URL=$(echo "$DEPLOY_OUTPUT" | grep -oE 'https://[^[:space:]]+\.workers\.dev' | head -n1)
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # intervals.icu requires the client_secret on /api/oauth/token (HTTP 422
      # without it).  The preferred path is KV (multi-tenant): store the secret
      # keyed by client_id so the worker can serve any registered client.
      # The legacy wrangler-secret path is kept as a fallback for deployments
      # that have not yet provisioned the KV namespace.
      - name: Install OAuth client_secret on the worker
        working-directory: workers/intervals-cors-proxy
        run: |
          if [ -z "$INTERVALS_OAUTH_CLIENT_SECRET" ]; then
            echo "INTERVALS_OAUTH_CLIENT_SECRET secret not configured — the worker"
            echo "cannot inject it and token exchange will fail (the app never"
            echo "carries the secret)."
            exit 0
          fi
          # KV path: store secret keyed by client_id ("259").
          # Requires a non-commented CLIENT_SECRETS binding and id in the same kv_namespaces block.
          if awk '
            BEGIN { in_kv=0; has_binding=0; has_id=0; found=0 }
            /^\[\[kv_namespaces\]\]/ {
              if (in_kv && has_binding && has_id) found=1;
              in_kv=1; has_binding=0; has_id=0; next;
            }
            {
              line=$0;
              sub(/#.*/, "", line);
              if (!in_kv) next;
              if (line ~ /^[[:space:]]*binding[[:space:]]*=[[:space:]]*"CLIENT_SECRETS"[[:space:]]*$/) has_binding=1;
              if (line ~ /^[[:space:]]*id[[:space:]]*=[[:space:]]*"[^"]+"[[:space:]]*$/) has_id=1;
            }
            END {
              if (in_kv && has_binding && has_id) found=1;
              exit(found ? 0 : 1);
            }
          ' wrangler.toml 2>/dev/null; then
            npx wrangler kv key put "259" "$INTERVALS_OAUTH_CLIENT_SECRET" --binding=CLIENT_SECRETS --config wrangler.toml
            echo "KV entry for client_id=259 written."
          else
            echo "CLIENT_SECRETS KV namespace binding/id not configured in wrangler.toml — skipping KV step."
          fi
          # Legacy wrangler-secret fallback (single-tenant env-var mode).
          printf '%s' "$INTERVALS_OAUTH_CLIENT_SECRET" | npx wrangler secret put INTERVALS_CLIENT_SECRET --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INTERVALS_OAUTH_CLIENT_SECRET: ${{ secrets.INTERVALS_OAUTH_CLIENT_SECRET }}

      # Catch silent mis-deployments (e.g. the worker URL serving a static
      # site): a bogus token request must reach intervals.icu and come back
      # as a JSON error, never an empty 404 or HTML.
      - name: Verify deployed proxy forwards to intervals.icu
        run: |
          WORKER_URL="${{ steps.deploy.outputs.worker_url }}"
          if [ -z "$WORKER_URL" ]; then
            echo "Could not determine worker URL from wrangler output"; exit 1
          fi
          BODY=$(curl -s --compressed -X POST "$WORKER_URL/proxy/api/oauth/token" \
            -H 'X-MT-Client: desktop' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            -d 'grant_type=authorization_code&client_id=259&code=ci-verify&redirect_uri=http://localhost:1/')
          echo "Response: $BODY"
          case "$BODY" in
            \{*) echo "OK — proxy forwards to intervals.icu" ;;
            *)  echo "FAIL — expected a JSON error from intervals.icu; the worker is not proxying"; exit 1 ;;
          esac

      # VirtualRow uploads activities as multipart/form-data with a binary FIT
      # part (#359).  An invalid bearer token means upstream answers 401 before
      # anything is created, so these probes are non-mutating.  A 401 proves the
      # method, query string, Authorization header and binary body all reached
      # intervals.icu; a 403 would mean the origin was rejected by the worker.
      - name: Verify multipart upload + CORS on rejected origins
        run: |
          WORKER_URL="${{ steps.deploy.outputs.worker_url }}"
          printf '\x0e\x10\x20\x00.FIT\x00\x00' > probe.fit
          fail=0

          for ORIGIN in https://maximumtrainer.github.io http://localhost:5173 http://127.0.0.1:5173; do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H "Origin: $ORIGIN" \
              -H 'Authorization: Bearer not-a-real-token' \
              -F 'file=@probe.fit;type=application/octet-stream' \
              "$WORKER_URL/proxy/api/v1/athlete/0/activities?name=ci-probe&external_id=ci-probe")
            if [ "$STATUS" = "401" ]; then
              echo "OK — multipart POST from $ORIGIN reached intervals.icu (401)"
            else
              echo "FAIL — multipart POST from $ORIGIN returned $STATUS, expected upstream 401"; fail=1
            fi
          done

          # A disallowed origin must still get readable CORS headers on the 403,
          # otherwise the browser reports a network error instead of the real cause.
          HEADERS=$(curl -s -D - -o /dev/null -X POST \
            -H 'Origin: https://not-allow-listed.example' \
            -H 'Authorization: Bearer not-a-real-token' \
            -F 'file=@probe.fit;type=application/octet-stream' \
            "$WORKER_URL/proxy/api/v1/athlete/0/activities")
          echo "$HEADERS"
          if echo "$HEADERS" | grep -qi '^HTTP/[0-9.]* 403' \
             && echo "$HEADERS" | grep -qi '^access-control-allow-origin:'; then
            echo "OK — 403 carries CORS headers"
          else
            echo "FAIL — 403 for a disallowed origin is missing CORS headers"; fail=1
          fi

          exit $fail