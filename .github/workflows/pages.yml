name: Deploy GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'workers/**'
      - '.github/workflows/pages.yml'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Optional: deploy Cloudflare CORS proxy ──────────────────────────────
      # Requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets.
      # After deployment, set INTERVALS_PROXY_URL as a repository variable
      # (Settings → Variables → Actions) so it is available in future runs.
      - name: Deploy Cloudflare CORS proxy
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        working-directory: workers/intervals-cors-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install -g wrangler
          DEPLOY_OUTPUT=$(wrangler deploy 2>&1)
          echo "$DEPLOY_OUTPUT"
          # Extract the workers.dev URL from wrangler output
          PROXY_URL=$(echo "$DEPLOY_OUTPUT" | grep -oP 'https://mt-intervals-proxy\.[^[:space:]]+' | head -1)
          if [ -n "$PROXY_URL" ]; then
            echo "INTERVALS_PROXY_URL=${PROXY_URL}" >> "$GITHUB_ENV"
            echo "Proxy deployed: $PROXY_URL"
          fi

      # ── Inject proxy URL into index.html ────────────────────────────────────
      # Prefers the URL discovered from the Cloudflare deploy step above;
      # falls back to the INTERVALS_PROXY_URL repository variable.
      - name: Inject Intervals.icu proxy URL
        env:
          REPO_PROXY_URL: ${{ vars.INTERVALS_PROXY_URL }}
        run: |
          # INTERVALS_PROXY_URL may have been set by the deploy step above
          PROXY_URL="${INTERVALS_PROXY_URL:-$REPO_PROXY_URL}"
          if [ -n "$PROXY_URL" ]; then
            sed -i "s|__INTERVALS_PROXY_URL__|${PROXY_URL}|g" docs/app/index.html
            echo "Proxy URL injected into index.html: $PROXY_URL"
          else
            echo "INTERVALS_PROXY_URL not configured — proxy interceptor disabled in WASM app"
            echo "See workers/intervals-cors-proxy/README.md for setup instructions"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
        # NOTE: GitHub Pages must be enabled in repo Settings → Pages → Source: GitHub Actions

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire docs/ directory as GitHub Pages artifact
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
