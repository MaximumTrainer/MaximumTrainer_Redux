name: Release - Linux

on:
  workflow_call:
    inputs:
      build_run_id:
        description: 'Run ID of build.yml that produced the linux artifact'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Run ID of build.yml that produced the linux artifact'
        required: true

env:
  QT_VERSION: '6.7.3'
  QWT_DIR: /tmp/qwt6

jobs:

  build_linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download pre-built linux artifact
      uses: actions/download-artifact@v4
      with:
        name: linux
        path: build
        run-id: ${{ inputs.build_run_id }}
        github-token: ${{ github.token }}

    - name: Mark binary executable
      run: chmod +x build/release/MaximumTrainer

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'desktop'
        arch: 'linux_gcc_64'
        modules: 'qtwebengine qtconnectivity qtwebchannel qtpositioning qtmultimedia qtserialport'
        cache: true
        cache-key-prefix: qt-linux

    - name: Install system dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          libusb-1.0-0-dev \
          libssl-dev \
          libgl1-mesa-dev \
          libxcb-cursor0 \
          libfuse2 \
          file

    - name: Restore QWT cache
      id: qwt-cache
      uses: actions/cache@v4
      with:
        path: ${{ env.QWT_DIR }}
        key: qwt-6.3.0-qt-${{ env.QT_VERSION }}-linux

    - name: Build and install QWT
      if: steps.qwt-cache.outputs.cache-hit != 'true'
      run: |
        cd /tmp
        curl -L -o qwt.tar.bz2 "https://sourceforge.net/projects/qwt/files/qwt/6.3.0/qwt-6.3.0.tar.bz2/download"
        tar xf qwt.tar.bz2
        cd qwt-6.3.0
        qmake qwt.pro
        make -j$(nproc)
        make install INSTALL_ROOT=/tmp/qwt6-stage
        mkdir -p "$QWT_DIR"
        mv /tmp/qwt6-stage/usr/local/qwt-6.3.0/* "$QWT_DIR"/

    - name: Download linuxdeploy and the Qt plugin
      # linuxdeploy + linuxdeploy-plugin-qt support Qt6; the classic
      # linuxdeployqt "continuous" build is Qt5-only.
      run: |
        cd /usr/local/bin
        sudo curl -Lo linuxdeploy \
          "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
        sudo curl -Lo linuxdeploy-plugin-qt \
          "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
        sudo chmod +x linuxdeploy linuxdeploy-plugin-qt

    - name: Package AppImage
      env:
        QMAKE: ${{ env.Qt6_DIR }}/bin/qmake
        # linuxdeploy-plugin-qt also bundles the QWT .so and any extra libs found
        # on LD_LIBRARY_PATH that the binary links against.
        LD_LIBRARY_PATH: ${{ env.QWT_DIR }}/lib
        # Point qmlimportscanner at the game's QML so the plugin bundles the
        # QtQuick / QtQuick.Shapes QML modules the retro-race view loads at
        # runtime (they live in a qrc, invisible to the static dependency scan).
        QML_SOURCES_PATHS: ${{ github.workspace }}/src/game/qml
      run: |
        # Create AppDir structure
        mkdir -p AppDir/usr/bin AppDir/usr/lib AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
        cp build/release/MaximumTrainer AppDir/usr/bin/
        # QtWebEngine spell-checker tries to set a dictionaries path relative to
        # the binary at startup and emits a WARNING if the directory is absent.
        # Create the empty directories so the path-override succeeds (no dictionaries
        # = spell-check disabled, unchanged from before).
        mkdir -p AppDir/usr/bin/qtwebengine_dictionaries
        mkdir -p AppDir/usr/libexec/qtwebengine_dictionaries
        # linuxdeploy-plugin-qt sets FONTCONFIG_FILE="${APPDIR}/etc/fonts/fonts.conf"
        # in the generated AppRun; bundle the build host's config so the packaged
        # app can locate fonts on the user's machine instead of logging
        # "Cannot load default config file: No such file: (null)".
        mkdir -p AppDir/etc/fonts
        cp /etc/fonts/fonts.conf AppDir/etc/fonts/ 2>/dev/null || true
        # Bundle the QWT shared library so the qt plugin / patchelf can resolve it
        cp -P "$QWT_DIR"/lib/libqwt.so* AppDir/usr/lib/
        # QtWebEngine dlopen()s these NSS modules at runtime, so linuxdeploy's
        # static dependency scan never sees them and leaves them out. Without
        # them, NSS loads the host's (newer) libsoftokn3 against the bundled
        # (older) libnssutil3, causing a fatal "NSSUTIL_3.x not found" crash on
        # the first HTTPS request (e.g. the Intervals.icu login). Pre-copy the
        # NSS module family into AppDir so linuxdeploy bundles a self-consistent
        # set alongside the libnss3/libnssutil3 it already pulls in.
        for nss_lib in libsoftokn3.so libfreebl3.so libfreeblpriv3.so \
                       libnssckbi.so libnssdbm3.so; do
          nss_src=$(find /usr/lib/x86_64-linux-gnu -name "$nss_lib" | head -1)
          if [ -n "$nss_src" ]; then
            cp -vL "$nss_src" AppDir/usr/lib/
          else
            echo "WARN: NSS module $nss_lib not found on build host"
          fi
        done
        # Qt's OpenSSL TLS backend (tls/libqopensslbackend.so) dlopen()s libssl
        # and libcrypto at runtime, so linuxdeploy's static scan bundles neither
        # reliably — in practice only libcrypto.so.3 gets pulled in. With the
        # AppImage RUNPATH ($ORIGIN/../lib) the bundled libcrypto wins, but libssl
        # is then resolved from the user's host. OpenSSL enforces a libssl<->
        # libcrypto build-version match, so on any host whose OpenSSL 3.0.x point
        # release differs from the build host's, the pair mismatches and every
        # HTTPS connection logs "QSslSocket: TLS initialization failed". Bundle the
        # matched pair so the backend always loads a self-consistent OpenSSL.
        for ssl_lib in libssl.so.3 libcrypto.so.3; do
          ssl_src=$(find /usr/lib/x86_64-linux-gnu -name "$ssl_lib" | head -1)
          if [ -n "$ssl_src" ]; then
            cp -vL "$ssl_src" AppDir/usr/lib/
          else
            echo "WARN: OpenSSL library $ssl_lib not found on build host"
          fi
        done
        # Desktop entry required by linuxdeploy
        cat > AppDir/usr/share/applications/maximumtrainer.desktop << 'EOF'
        [Desktop Entry]
        Name=Maximum Trainer
        Exec=MaximumTrainer
        Icon=maximumtrainer
        Type=Application
        Categories=Sports;
        EOF
        # Copy icon
        if [ -f resources/images/main_icon.png ]; then
          cp resources/images/main_icon.png AppDir/usr/share/icons/hicolor/256x256/apps/maximumtrainer.png
        else
          # Fallback: create a placeholder icon
          touch AppDir/usr/share/icons/hicolor/256x256/apps/maximumtrainer.png
        fi
        linuxdeploy --appdir AppDir --plugin qt \
          --executable AppDir/usr/bin/MaximumTrainer \
          --desktop-file AppDir/usr/share/applications/maximumtrainer.desktop \
          --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/maximumtrainer.png \
          --output appimage
        # linuxdeploy names the AppImage after the desktop Name= entry + arch
        # (e.g. Maximum_Trainer-x86_64.AppImage), so use a wildcard to rename it
        appimage=$(find . -maxdepth 1 -name "*.AppImage" | head -1)
        if [ -z "$appimage" ]; then echo "Error: No AppImage found"; exit 1; fi
        mv "$appimage" MaximumTrainer-linux-x86_64.AppImage

    - name: Verify Qt + QWT libraries bundled
      run: |
        echo "=== Qt6 / QWT check ==="
        if find AppDir -name "libQt6Core*" -print -quit 2>/dev/null | grep -q .; then
          echo "PASS: libQt6Core found in AppDir"
        else
          echo "WARN: libQt6Core not found in AppDir"
        fi
        if find AppDir -name "libqwt*" -print -quit 2>/dev/null | grep -q .; then
          echo "PASS: libqwt found in AppDir"
        else
          echo "WARN: libqwt not found in AppDir"
        fi

    - name: Verify NSS runtime modules bundled
      # libsoftokn3 is the critical one — its absence (or a version skew against
      # the bundled libnssutil3) crashes QtWebEngine on the first HTTPS request.
      run: |
        echo "=== NSS module check ==="
        if find AppDir -name "libsoftokn3.so" -print -quit 2>/dev/null | grep -q .; then
          echo "PASS: libsoftokn3 bundled in AppDir"
        else
          echo "FAIL: libsoftokn3 missing from AppDir — QtWebEngine will crash on HTTPS"
          exit 1
        fi

    - name: Verify OpenSSL pair bundled
      # Both libssl and libcrypto must be present so Qt's TLS backend loads a
      # self-consistent OpenSSL — a lone libcrypto causes a libssl<->libcrypto
      # version mismatch and "TLS initialization failed" on hosts with a
      # different OpenSSL 3.0.x point release.
      run: |
        echo "=== OpenSSL check ==="
        for ssl_lib in libssl.so.3 libcrypto.so.3; do
          if find AppDir -name "$ssl_lib" -print -quit 2>/dev/null | grep -q .; then
            echo "PASS: $ssl_lib bundled in AppDir"
          else
            echo "FAIL: $ssl_lib missing from AppDir — HTTPS/TLS will fail"
            exit 1
          fi
        done

    - name: Verify xdg-desktop-portal theme plugin bundled
      # main.cpp sets QT_QPA_PLATFORMTHEME=xdgdesktopportal so the app tracks the
      # desktop light/dark preference under xcb. The plugin must be bundled or
      # the app silently falls back to Light.
      run: |
        echo "=== platform theme check ==="
        if find AppDir -name "libqxdgdesktopportal.so" -print -quit 2>/dev/null | grep -q .; then
          echo "PASS: libqxdgdesktopportal bundled in AppDir"
        else
          echo "FAIL: libqxdgdesktopportal missing — dark-mode detection will not work"
          exit 1
        fi

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-appimage
        path: MaximumTrainer-linux-x86_64.AppImage
