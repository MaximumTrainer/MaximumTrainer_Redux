name: Nightly fuzz

# Long libFuzzer run of the three targets (sanitizers.yml only fuzzes 60 s per
# target on each push). The working corpus is cached between nights so
# coverage keeps growing. A crash uploads the inputs and opens (or comments on)
# a single "fuzz" issue.
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: 'Fuzzing time per target, in seconds'
        default: '1200'

concurrency:
  group: fuzz-nightly
  cancel-in-progress: false

env:
  QT_VERSION: '6.11.3'
  AQT_CONFIG: ${{ github.workspace }}/.github/aqt-settings.ini

jobs:
  fuzz:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
    env:
      FUZZ_SECONDS: ${{ github.event.inputs.seconds || '1200' }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Point apt at a reachable Ubuntu mirror
      run: |
        for host in mirrors.edge.kernel.org azure.archive.ubuntu.com archive.ubuntu.com; do
          if curl -fsS -o /dev/null -m 10 "http://$host/ubuntu/dists/jammy/Release"; then
            echo "Using http://$host/ubuntu/"
            echo "http://$host/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
            sudo grep -rl 'azure\.archive\.ubuntu\.com\|//archive\.ubuntu\.com\|//security\.ubuntu\.com' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null \
              | xargs -r sudo sed -i -E "s#https?://(azure\.archive|archive|security)\.ubuntu\.com/ubuntu/?#http://$host/ubuntu/#g" || true
            break
          fi
        done
        printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'desktop'
        arch: 'linux_gcc_64'
        modules: 'qtconnectivity'
        cache: true
        cache-key-prefix: qt-linux-fuzz

    - name: Install clang + libFuzzer runtime
      run: |
        sudo apt-get update -y
        sudo apt-get install -y clang-15 libclang-common-15-dev libssl-dev
        find /usr/lib/llvm-15 -name 'libclang_rt.fuzzer-x86_64.a' | grep -q . || { echo "libFuzzer runtime missing"; exit 1; }
        echo "/usr/lib/llvm-15/bin" >> "$GITHUB_PATH"

    - name: Build fuzz targets
      run: |
        mkdir -p build/tests
        cd tests/fuzz
        for target in fit_decode_fuzz ble_notification_fuzz zwo_import_fuzz; do
          rm -f Makefile
          qmake -spec linux-clang "$target.pro"
          make -j"$(nproc)"
        done

    - name: Restore working corpus
      uses: actions/cache/restore@v4
      with:
        path: work-*
        key: fuzz-corpus-${{ github.run_id }}
        restore-keys: fuzz-corpus-

    # The three targets run side by side, one core each.
    - name: Fuzz
      id: fuzz
      env:
        ASAN_OPTIONS: detect_leaks=1
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      run: |
        mkdir -p fuzz-artifacts
        pids=()
        for pair in fit:fit_decode_fuzz ble:ble_notification_fuzz zwo:zwo_import_fuzz; do
          corpus="${pair%%:*}"; target="${pair#*:}"
          mkdir -p "work-$corpus"
          ./build/tests/$target "work-$corpus" tests/fuzz/corpus/$corpus \
              -max_total_time="$FUZZ_SECONDS" -timeout=10 -rss_limit_mb=2048 \
              -artifact_prefix="fuzz-artifacts/$target-" > "fuzz-$target.log" 2>&1 &
          pids+=($!)
        done
        status=0
        for pid in "${pids[@]}"; do wait "$pid" || status=1; done
        for log in fuzz-*.log; do
          echo "::group::$log"
          grep -E '^#[0-9]+.*(DONE|cov:)' "$log" | tail -1 || true
          grep -E 'ERROR|runtime error|SUMMARY' "$log" | head -20 || true
          echo "::endgroup::"
        done
        cp fuzz-*.log fuzz-artifacts/ 2>/dev/null || true
        exit $status

    - name: Save working corpus
      if: always()
      uses: actions/cache/save@v4
      with:
        path: work-*
        key: fuzz-corpus-${{ github.run_id }}

    - name: Upload crashing inputs
      if: failure() && steps.fuzz.outcome == 'failure'
      uses: actions/upload-artifact@v7
      with:
        name: fuzz-artifacts
        path: fuzz-artifacts/
        retention-days: 30

    - name: Report on the fuzz issue
      if: failure() && steps.fuzz.outcome == 'failure'
      env:
        GH_TOKEN: ${{ github.token }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        summary=$(grep -hE 'SUMMARY|ERROR: libFuzzer' fuzz-*.log | sort -u | head -10)
        body=$(printf 'Nightly fuzzing found a problem.\n\nRun: %s (crashing inputs are in the `fuzz-artifacts` artifact)\n\n```\n%s\n```\n\nAdd fixed inputs to `tests/fuzz/regressions/` so CI replays them.\n' "$RUN_URL" "$summary")
        gh label create fuzz --color B60205 --description "Found by the nightly fuzzer" 2>/dev/null || true
        existing=$(gh issue list --label fuzz --state open --json number --jq '.[0].number')
        if [ -n "$existing" ]; then
          gh issue comment "$existing" --body "$body"
        else
          gh issue create --title "Nightly fuzz found a crash" --label fuzz --body "$body"
        fi
