name: Release - macOS

on:
  workflow_call:
    inputs:
      build_run_id:
        description: 'Run ID of build.yml that produced the macos artifact'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Run ID of build.yml that produced the macos artifact'
        required: true

jobs:

  build_mac:
    runs-on: macos-latest
    permissions:
      contents: read
      actions: read

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download pre-built macos artifact
      uses: actions/download-artifact@v4
      with:
        name: macos
        path: build
        run-id: ${{ inputs.build_run_id }}
        github-token: ${{ github.token }}

    - name: Mark binary executable
      run: chmod +x build/release/MaximumTrainer.app/Contents/MacOS/MaximumTrainer

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.7.3'
        host: 'mac'
        target: 'desktop'
        arch: 'clang_64'
        modules: 'qtwebengine qtconnectivity qtwebchannel qtpositioning qtmultimedia'

    - name: Install OpenSSL
      run: brew install openssl@3

    - name: Build and install QWT
      run: |
        brew uninstall qwt --force --ignore-dependencies 2>/dev/null || true
        cd /tmp
        curl -L -o qwt.tar.bz2 "https://sourceforge.net/projects/qwt/files/qwt/6.3.0/qwt-6.3.0.tar.bz2/download"
        tar -xjf qwt.tar.bz2
        cd qwt-6.3.0
        sed -i.bak 's/QwtFramework//' qwtconfig.pri
        qmake qwt.pro
        make -j$(sysctl -n hw.logicalcpu)
        sudo make install

    - name: Package with macdeployqt
      run: |
        APP=build/release/MaximumTrainer.app/Contents/MacOS/MaximumTrainer
        QWT_LIB=/usr/local/qwt-6.3.0/lib/libqwt.6.dylib

        # QWT 6.3.0 default LC_ID_DYLIB is /usr/lib/libqwt.6.dylib but the actual
        # file is at $QWT_LIB. macdeployqt follows LC_ID_DYLIB to locate a library,
        # so it cannot find QWT unless we fix the install_name first.
        sudo install_name_tool -id "$QWT_LIB" "$QWT_LIB"

        # The app binary's LC_LOAD_DYLIB was baked in at link time using QWT's old
        # install_name. Fix it so macdeployqt can match it to the corrected dylib.
        install_name_tool -change /usr/lib/libqwt.6.dylib "$QWT_LIB" "$APP" || true

        # Add QWT rpath so the .app stays self-contained when moved between
        # machines. '|| true' tolerates a duplicate rpath already baked in at
        # build time. (QtMultimedia frameworks are handled by macdeployqt.)
        install_name_tool -add_rpath /usr/local/qwt-6.3.0/lib "$APP" || true

        macdeployqt build/release/MaximumTrainer.app -dmg
        mv build/release/MaximumTrainer.dmg MaximumTrainer-macos.dmg

    - name: Verify bundled frameworks
      run: |
        echo "=== Frameworks bundled in .app ==="
        ls build/release/MaximumTrainer.app/Contents/Frameworks/ 2>/dev/null || echo "(Frameworks directory not found)"
        echo "=== QWT check ==="
        find build/release/MaximumTrainer.app -name "libqwt*" 2>/dev/null || echo "WARN: libqwt not bundled"
        echo "=== QtMultimedia check ==="
        find build/release/MaximumTrainer.app -name "*QtMultimedia*" 2>/dev/null || echo "WARN: QtMultimedia not bundled"
        echo "=== QtOpenGL check ==="
        if find build/release/MaximumTrainer.app -name "QtOpenGL*" -print -quit 2>/dev/null | grep -q .; then
          echo "PASS: QtOpenGL found in .app bundle"
        else
          echo "WARN: QtOpenGL not bundled"
        fi

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: macos-dmg
        path: MaximumTrainer-macos.dmg
