name: Release - macOS

on:
  workflow_call:
    inputs:
      build_run_id:
        description: 'Run ID of build.yml that produced the macos artifact'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Run ID of build.yml that produced the macos artifact'
        required: true

jobs:

  build_mac:
    runs-on: macos-latest
    permissions:
      contents: read
      actions: read

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download pre-built macos artifact
      uses: actions/download-artifact@v4
      with:
        name: macos
        path: build
        run-id: ${{ inputs.build_run_id }}
        github-token: ${{ github.token }}

    - name: Mark binary executable
      run: chmod +x build/release/MaximumTrainer.app/Contents/MacOS/MaximumTrainer

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.7.3'
        host: 'mac'
        target: 'desktop'
        arch: 'clang_64'
        modules: 'qtwebengine qtconnectivity qtwebchannel qtpositioning'

    - name: Install SFML and OpenSSL
      run: brew install sfml openssl@3

    - name: Build and install QWT
      run: |
        brew uninstall qwt --force --ignore-dependencies 2>/dev/null || true
        cd /tmp
        curl -L -o qwt.tar.bz2 "https://sourceforge.net/projects/qwt/files/qwt/6.2.0/qwt-6.2.0.tar.bz2/download"
        tar -xjf qwt.tar.bz2
        cd qwt-6.2.0
        sed -i.bak 's/QwtFramework//' qwtconfig.pri
        qmake qwt.pro
        make -j$(sysctl -n hw.logicalcpu)
        sudo make install

    - name: Package with macdeployqt
      run: |
        APP=build/release/MaximumTrainer.app/Contents/MacOS/MaximumTrainer

        # macdeployqt resolves dependencies using the load commands baked into the
        # binary at link time.  QWT is built with its install_name set to
        # /usr/lib/libqwt.6.dylib (the QWT default), but the actual dylib is
        # installed to /usr/local/qwt-6.2.0/lib/.  Fix the reference so
        # macdeployqt can find and bundle QWT.
        install_name_tool -change /usr/lib/libqwt.6.dylib \
            /usr/local/qwt-6.2.0/lib/libqwt.6.dylib "$APP" || true

        # Add rpaths for QWT, OpenSSL, and SFML as a belt-and-suspenders fallback.
        # '|| true' tolerates duplicate rpaths already baked in at build time.
        install_name_tool -add_rpath /usr/local/qwt-6.2.0/lib "$APP" || true
        install_name_tool -add_rpath /usr/local/lib "$APP" || true
        install_name_tool -add_rpath $(brew --prefix openssl@3)/lib "$APP" || true
        install_name_tool -add_rpath $(brew --prefix sfml)/lib "$APP" || true

        macdeployqt build/release/MaximumTrainer.app -dmg
        mv build/release/MaximumTrainer.dmg MaximumTrainer-macos.dmg

    - name: Verify bundled frameworks
      run: |
        echo "=== Frameworks bundled in .app ==="
        ls build/release/MaximumTrainer.app/Contents/Frameworks/ 2>/dev/null || echo "(Frameworks directory not found)"
        echo "=== QWT check ==="
        find build/release/MaximumTrainer.app -name "libqwt*" 2>/dev/null || echo "WARN: libqwt not bundled"
        echo "=== SFML check ==="
        find build/release/MaximumTrainer.app -name "*sfml*" 2>/dev/null || echo "WARN: sfml not bundled"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: macos-dmg
        path: MaximumTrainer-macos.dmg
