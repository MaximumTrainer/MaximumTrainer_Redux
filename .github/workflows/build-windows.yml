name: Build - Windows

on:
  workflow_call:
    inputs:
      tag_name:
        description: 'Release tag to embed as APP_VERSION (e.g. v1.2.3). Falls back to git describe when empty.'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to embed as APP_VERSION (e.g. v1.2.3). Falls back to git describe when empty.'
        required: false
        default: ''

env:
  QT_VERSION: '6.7.3'

jobs:

  build_windows:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      # Qt installation root - install-qt-action places Qt under $QT_HOME\Qt\$version\$arch.
      # For local Windows builds, set QT_HOME to the parent of your Qt installation
      # (e.g. C:\ if Qt is at C:\Qt\6.7.3\msvc2019_64).
      QT_HOME: C:\Qt
      # Stable QWT install directory used by the cache action and PowerShell build steps.
      QWT_INSTALL_DIR: C:\qwt

    steps:
    - name: MSVC Environment Setup
      uses: ilammy/msvc-dev-cmd@v1

    - name: checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ env.QT_VERSION }}
        arch: win64_msvc2019_64
        modules: 'qtwebengine qtconnectivity qtwebchannel qtpositioning qtmultimedia'
        tools: 'tools_openssl_x64'
        dir: ${{ env.QT_HOME }}
        cache: true
        cache-key-prefix: qt-win

    - name: Set QTDIR
      run: echo "QTDIR=${{ env.QT_HOME }}\Qt\${{ env.QT_VERSION }}\msvc2019_64" >> $env:GITHUB_ENV
      shell: powershell

    - name: Install jom
      run: choco install jom -y
      shell: cmd

    - name: Locate OpenSSL 3 DLLs
      # Qt 6 requires OpenSSL 3.x DLLs (libssl-3-x64.dll / libcrypto-3-x64.dll)
      # for HTTPS/TLS. install-qt-action's tools_openssl_x64 tool installs them
      # under Qt\Tools\OpenSSLv3\Win_x64\bin. Expose that directory as OPENSSL_BIN.
      run: |
        $dll = Get-ChildItem "${{ env.QT_HOME }}\Qt" -Recurse -Filter "libssl-3-x64.dll" -ErrorAction SilentlyContinue |
               Select-Object -First 1
        if (-not $dll) { Write-Error "libssl-3-x64.dll not found under ${{ env.QT_HOME }}\Qt"; exit 1 }
        echo "OPENSSL_BIN=$($dll.DirectoryName)" >> $env:GITHUB_ENV
        Write-Host "OpenSSL DLLs at: $($dll.DirectoryName)"
      shell: powershell

    - name: Restore SFML cache
      id: sfml-cache
      uses: actions/cache@v4
      with:
        path: C:\sfml
        key: sfml-2.6.1-vc17-win64

    - name: Download and install SFML
      if: steps.sfml-cache.outputs.cache-hit != 'true'
      run: |
        curl.exe -L -o "$env:TEMP\sfml.zip" "https://github.com/SFML/SFML/releases/download/2.6.1/SFML-2.6.1-windows-vc17-64-bit.zip"
        Expand-Archive -Path "$env:TEMP\sfml.zip" -DestinationPath "C:\sfml"
      shell: powershell

    - name: Restore QWT cache
      id: qwt-cache
      uses: actions/cache@v4
      with:
        path: ${{ env.QWT_INSTALL_DIR }}
        key: qwt-6.2.0-qt-${{ env.QT_VERSION }}-msvc2019-win64

    - name: Build QWT
      # No QWT apt/Qt6 binary package exists, so build 6.2.0 from source against
      # the installed Qt6 and install it to QWT_INSTALL_DIR. PowerVelo.pro is
      # pointed at this location via QWT_INSTALL=... .
      if: steps.qwt-cache.outputs.cache-hit != 'true'
      run: |
        $qwtInstallDirFwd = $env:QWT_INSTALL_DIR -replace '\\', '/'
        Set-Location ..
        # Use curl.exe -L to follow SourceForge redirects reliably
        curl.exe -L -o "$env:TEMP\qwt.tar.bz2" "https://sourceforge.net/projects/qwt/files/qwt/6.2.0/qwt-6.2.0.tar.bz2/download"
        7z x "$env:TEMP\qwt.tar.bz2" -o"$env:TEMP" -y
        7z x "$env:TEMP\qwt.tar" -o"." -y
        Rename-Item "qwt-6.2.0" "qwt-src"
        Set-Location "qwt-src"
        # Patch every QWT_INSTALL_PREFIX assignment to use the new path
        (Get-Content "qwtconfig.pri") | ForEach-Object {
            if ($_ -match 'QWT_INSTALL_PREFIX\s*=') {
                $_ -replace '(QWT_INSTALL_PREFIX\s*=\s*).*', "`$1$qwtInstallDirFwd"
            } else { $_ }
        } | Set-Content "qwtconfig.pri"
        qmake qwt.pro
        jom /J $env:NUMBER_OF_PROCESSORS
        jom install
      shell: powershell

    - name: Determine build version
      run: |
        $passedTag = "${{ inputs.tag_name }}"
        if ($passedTag -ne '') {
          $tag = $passedTag
          Write-Host "Using passed tag: $tag"
        } else {
          $tag = (git describe --tags --match 'v[0-9]*' --always) -replace '\r','' -replace '-\d+-g[0-9a-f]+$',''
          if (-not ($tag -match '^[vV][0-9]')) { $tag = 'v0.0.0' }
          Write-Host "Using git describe: $tag"
        }
        "GIT_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        Write-Host "Build version: $tag"
      shell: powershell

    - name: Create Makefile
      run: |
        $qwtInstallDirFwd = $env:QWT_INSTALL_DIR -replace '\\','/'
        $sfmlDir = (Get-ChildItem "C:\sfml" -Directory | Select-Object -First 1).FullName
        $sfmlDirFwd = $sfmlDir -replace '\\','/'
        $env:TP_CLIENT_SECRET = "${{ secrets.TP_CLIENT_SECRET }}"
        $env:INTERVALS_OAUTH_CLIENT_ID = "${{ secrets.INTERVALS_OAUTH_CLIENT_ID }}"
        $env:INTERVALS_OAUTH_CLIENT_SECRET = "${{ secrets.INTERVALS_OAUTH_CLIENT_SECRET }}"
        qmake PowerVelo.pro `
          "QWT_INSTALL=$qwtInstallDirFwd" `
          "SFML_INSTALL=$sfmlDirFwd"
      shell: powershell

    - name: Build
      run: 'jom /J $env:NUMBER_OF_PROCESSORS'
      shell: powershell

    - name: Copy QWT runtime DLL
      # qwt.dll is linked at build time but windeployqt does not know about it.
      # Copy it alongside MaximumTrainer.exe so the build artifact is self-contained
      # and MaximumTrainer.exe can be launched directly from build\release\ without
      # a "qwt.dll not found" loader error.
      run: |
        $qwtDll = "$env:QWT_INSTALL_DIR\lib\qwt.dll"
        if (-not (Test-Path $qwtDll)) {
          Write-Error "qwt.dll not found at expected path: $qwtDll"
          exit 1
        }
        Copy-Item $qwtDll "build\release\" -Force
        Write-Host "Copied qwt.dll to build\release\"
      shell: powershell

    - name: Copy OpenSSL DLLs
      # Qt 6 requires OpenSSL 3.x DLLs for HTTPS/TLS.
      # OPENSSL_BIN is set by the "Locate OpenSSL 3 DLLs" step above.
      run: |
        $opensslBin = "$env:OPENSSL_BIN"
        if (Test-Path $opensslBin) {
          foreach ($dll in @("libssl-3-x64.dll", "libcrypto-3-x64.dll")) {
            $src = "$opensslBin\$dll"
            if (Test-Path $src) {
              Copy-Item $src "build\release\" -Force
              Write-Host "Copied $dll"
            } else {
              Write-Warning "OpenSSL DLL not found: $src"
            }
          }
        } else {
          Write-Warning "OPENSSL_BIN directory not found: $opensslBin"
        }
      shell: powershell

    - name: Copy SFML runtime DLLs
      # sfml-audio-2.dll (and its dependencies sfml-system-2.dll, openal32.dll)
      # are not discovered by windeployqt. Copy the release-mode DLLs from the
      # SFML bin directory so the installed app can load them at runtime.
      run: |
        $sfmlDir = (Get-ChildItem "C:\sfml" -Directory | Select-Object -First 1).FullName
        $sfmlBin = "$sfmlDir\bin"
        foreach ($dll in @("sfml-audio-2.dll", "sfml-system-2.dll", "openal32.dll")) {
          $src = "$sfmlBin\$dll"
          if (Test-Path $src) {
            Copy-Item $src "build\release\" -Force
            Write-Host "Copied $dll"
          } else {
            Write-Warning "SFML DLL not found: $src"
          }
        }
      shell: powershell

    - name: Deploy Qt for main executable
      run: |
        & "$env:QTDIR\bin\windeployqt.exe" --release `
            --no-translations `
            --no-system-d3d-compiler `
            build\release\MaximumTrainer.exe
      shell: powershell

    - name: Build runtime validation test
      run: |
        New-Item -ItemType Directory -Force -Path build\tests | Out-Null
        Set-Location tests\integration
        qmake runtime_validation_tests.pro
        jom /J $env:NUMBER_OF_PROCESSORS
      shell: powershell

    - name: Build BLE API smoke test
      run: |
        New-Item -ItemType Directory -Force -Path build\tests | Out-Null
        Set-Location tests\integration
        qmake btle_api_tests.pro
        jom /J $env:NUMBER_OF_PROCESSORS
      shell: powershell

    - name: Build offline mode test
      run: |
        New-Item -ItemType Directory -Force -Path build\tests | Out-Null
        Set-Location tests\integration
        qmake offline_mode_tests.pro
        jom /J $env:NUMBER_OF_PROCESSORS
      shell: powershell

    - name: Build online mode test
      run: |
        New-Item -ItemType Directory -Force -Path build\tests | Out-Null
        Set-Location tests\integration
        qmake online_mode_tests.pro
        jom /J $env:NUMBER_OF_PROCESSORS
      shell: powershell

    - name: Build login screen test
      run: |
        New-Item -ItemType Directory -Force -Path build\tests | Out-Null
        Set-Location tests\integration
        $qwtDirFwd = $env:QWT_INSTALL_DIR -replace '\\','/'
        qmake login_screen_tests.pro "QWT_INSTALL=$qwtDirFwd"
        jom /J $env:NUMBER_OF_PROCESSORS
      shell: powershell

    - name: Build workout UI test
      run: |
        New-Item -ItemType Directory -Force -Path build\tests | Out-Null
        Set-Location tests\integration
        $qwtDirFwd = $env:QWT_INSTALL_DIR -replace '\\','/'
        qmake workout_ui_tests.pro "QWT_INSTALL=$qwtDirFwd"
        jom /J $env:NUMBER_OF_PROCESSORS
      shell: powershell

    - name: Build workout parsing test
      run: |
        New-Item -ItemType Directory -Force -Path build\tests | Out-Null
        Set-Location tests\integration
        qmake workout_parsing_tests.pro
        jom /J $env:NUMBER_OF_PROCESSORS
      shell: powershell

    - name: Build UI navigation test
      run: |
        New-Item -ItemType Directory -Force -Path build\tests | Out-Null
        Set-Location tests\integration
        $qwtDirFwd = $env:QWT_INSTALL_DIR -replace '\\','/'
        qmake ui_navigation_tests.pro "QWT_INSTALL=$qwtDirFwd"
        jom /J $env:NUMBER_OF_PROCESSORS
      shell: powershell

    - name: Build UI screens test
      run: |
        New-Item -ItemType Directory -Force -Path build\tests | Out-Null
        Set-Location tests\integration
        $qwtDirFwd = $env:QWT_INSTALL_DIR -replace '\\','/'
        qmake ui_screens_tests.pro "QWT_INSTALL=$qwtDirFwd"
        jom /J $env:NUMBER_OF_PROCESSORS
      shell: powershell

    - name: Build workout I/O test
      run: |
        New-Item -ItemType Directory -Force -Path build\tests | Out-Null
        Set-Location tests\integration
        $qwtDirFwd = $env:QWT_INSTALL_DIR -replace '\\','/'
        qmake workout_io_tests.pro "QWT_INSTALL=$qwtDirFwd"
        jom /J $env:NUMBER_OF_PROCESSORS
      shell: powershell

    - name: Build workout creator test
      run: |
        New-Item -ItemType Directory -Force -Path build\tests | Out-Null
        Set-Location tests\integration
        qmake workout_creator_tests.pro
        jom /J $env:NUMBER_OF_PROCESSORS
      shell: powershell

    - name: Deploy Qt for test binaries
      run: |
        $tests = @(
          "runtime_validation_tests", "btle_api_tests", "offline_mode_tests",
          "online_mode_tests", "login_screen_tests", "workout_ui_tests",
          "workout_parsing_tests", "ui_navigation_tests", "ui_screens_tests",
          "workout_io_tests", "workout_creator_tests"
        )
        foreach ($t in $tests) {
          $exe = "build\tests\$t.exe"
          if (Test-Path $exe) {
            & "$env:QTDIR\bin\windeployqt.exe" --release `
                --no-translations `
                --no-system-d3d-compiler `
                $exe
          }
        }
        foreach ($dll in @("libssl-3-x64.dll", "libcrypto-3-x64.dll")) {
          $src = "$env:OPENSSL_BIN\$dll"
          if (Test-Path $src) { Copy-Item $src "build\tests\" -Force }
        }
        # qwt.dll is a third-party DLL not discovered by windeployqt; any test
        # binary that directly instantiates QwtPlot/QwtPlotCurve will fail to
        # load without it.  Copy it alongside the test executables.
        $qwtDll = "$env:QWT_INSTALL_DIR\lib\qwt.dll"
        if (Test-Path $qwtDll) {
          Copy-Item $qwtDll "build\tests\" -Force
          Write-Host "Copied qwt.dll to build\tests\"
        } else {
          Write-Warning "qwt.dll not found at $qwtDll - workout_ui_tests may fail to load"
        }
      shell: powershell

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows
        path: build\

  # ──────────────────────────────────────────────────────────────────────────
  # Runtime Validation – Windows
  #
  # Verifies that the application UI initialises to a "Ready" state on Windows:
  #   • Bluetooth stack is queryable (API returns "Not Found", not "Unsupported")
  #   • All four sensor channels carry realistic values within 10 seconds
  #   • A labelled 1280×720 screenshot is captured as visual build evidence
  # ──────────────────────────────────────────────────────────────────────────
  test_runtime_validation:
    runs-on: windows-latest
    needs: build_windows
    permissions:
      contents: read

    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: windows
        path: build

    - name: Run runtime validation test
      run: .\build\tests\runtime_validation_tests.exe -v2
      shell: powershell

    - name: Upload runtime validation screenshot
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: runtime-validation-screenshot-windows
        path: build\tests\screenshot-windows-*.png

  # ──────────────────────────────────────────────────────────────────────────
  # BLE API Smoke Test – Windows
  #
  # Exercises the real BtleHub → QLowEnergyController code path on Windows.
  # Uses the WinRT Bluetooth stack; on CI runners with no BT adapter the test
  # QSKIP gracefully.  No display required (headless Qt Test binary).
  # ──────────────────────────────────────────────────────────────────────────
  test_btle_api:
    runs-on: windows-latest
    needs: build_windows
    permissions:
      contents: read

    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: windows
        path: build

    - name: Run BLE API smoke test
      run: .\build\tests\btle_api_tests.exe -v2
      shell: powershell

  # ──────────────────────────────────────────────────────────────────────────
  # Offline Mode Integration Test – Windows
  #
  # Verifies that MaximumTrainer's core offline functionality works on Windows
  # without a network connection and without physical Bluetooth hardware:
  #   • Local workout XML files can be created and parsed from disk.
  #   • SimulatorHub broadcasts realistic CSC (0x1816) and Power (0x1818)
  #     cycling data (cadence, speed, power) within expected ranges.
  #   • A labelled 1280×720 screenshot is captured showing the offline mode
  #     indicator and live BTLE sensor metrics.
  #   • Accumulated data points are written to a TSV activity file,
  #     confirming offline data persistence.
  # ──────────────────────────────────────────────────────────────────────────
  test_offline_mode:
    runs-on: windows-latest
    needs: build_windows
    permissions:
      contents: read

    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: windows
        path: build

    - name: Run offline mode test
      run: .\build\tests\offline_mode_tests.exe -v2
      shell: powershell

    - name: Upload offline mode screenshot and activity file
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: offline-mode-artefacts-windows
        path: |
          build\tests\offline-mode-windows-*.png
          build\tests\activity-windows-*.tsv

  # ──────────────────────────────────────────────────────────────────────────
  # Intervals.icu Live Integration Tests – Windows
  #
  # Makes real HTTP requests to https://intervals.icu/api/v1 using the shared
  # test account.  Requires GitHub Secrets to be configured:
  #   INTERVALS_ICU_API_KEY    – personal API key (intervals.icu Settings → API)
  #   INTERVALS_ICU_ATHLETE_ID – athlete ID, e.g. i12345
  #
  # Tests call QSKIP gracefully when either secret is absent (fork PRs, local
  # development without credentials).
  # ──────────────────────────────────────────────────────────────────────────
  test_intervals_icu_integration:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      INTERVALS_ICU_API_KEY:    ${{ secrets.INTERVALS_ICU_API_KEY }}
      INTERVALS_ICU_ATHLETE_ID: ${{ secrets.INTERVALS_ICU_ATHLETE_ID }}

    steps:
    - name: MSVC Environment Setup
      uses: ilammy/msvc-dev-cmd@v1

    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ env.QT_VERSION }}
        arch: win64_msvc2019_64
        tools: 'tools_openssl_x64'
        dir: 'C:\Qt'
        cache: true
        cache-key-prefix: qt-win

    - name: Set QTDIR
      run: echo "QTDIR=C:\Qt\Qt\${{ env.QT_VERSION }}\msvc2019_64" >> $env:GITHUB_ENV
      shell: powershell

    - name: Install jom
      run: choco install jom -y
      shell: cmd

    - name: Locate OpenSSL 3 DLLs
      run: |
        $dll = Get-ChildItem "C:\Qt\Qt" -Recurse -Filter "libssl-3-x64.dll" -ErrorAction SilentlyContinue |
               Select-Object -First 1
        if (-not $dll) { Write-Error "libssl-3-x64.dll not found"; exit 1 }
        echo "OPENSSL_BIN=$($dll.DirectoryName)" >> $env:GITHUB_ENV
      shell: powershell

    - name: Build integration tests
      run: |
        New-Item -ItemType Directory -Force -Path build\tests | Out-Null
        Set-Location tests\intervals_icu_integration
        qmake intervals_icu_integration_tests.pro
        jom /J $env:NUMBER_OF_PROCESSORS
      shell: powershell

    - name: Deploy Qt DLLs for test binary
      run: |
        & "$env:QTDIR\bin\windeployqt.exe" --release `
            --no-translations `
            --no-system-d3d-compiler `
            build\tests\intervals_icu_integration_tests.exe
        foreach ($dll in @("libssl-3-x64.dll", "libcrypto-3-x64.dll")) {
          $src = "$env:OPENSSL_BIN\$dll"
          if (Test-Path $src) { Copy-Item $src "build\tests\" -Force }
        }
      shell: powershell

    - name: Run Intervals.icu integration tests
      run: .\build\tests\intervals_icu_integration_tests.exe -v2
      shell: powershell

  # ──────────────────────────────────────────────────────────────────────────
  # Online Mode Authentication Test – Windows
  #
  # Simulates a user authenticating into the running application on Windows.
  # A 1280x720 window is shown, a live HTTPS authentication request is made
  # to https://intervals.icu/api/v1 using credentials from GitHub Secrets,
  # and the result is displayed in the window and captured as a screenshot.
  #
  # Requires GitHub Secrets to be configured:
  #   INTERVALS_ICU_API_KEY    – personal API key (intervals.icu Settings → API)
  #   INTERVALS_ICU_ATHLETE_ID – athlete ID, e.g. i12345
  #
  # The test calls QSKIP gracefully when either secret is absent (fork PRs,
  # local development without credentials).
  # ──────────────────────────────────────────────────────────────────────────
  test_online_mode:
    runs-on: windows-latest
    needs: build_windows
    permissions:
      contents: read
    env:
      INTERVALS_ICU_API_KEY:    ${{ secrets.INTERVALS_ICU_API_KEY }}
      INTERVALS_ICU_ATHLETE_ID: ${{ secrets.INTERVALS_ICU_ATHLETE_ID }}

    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: windows
        path: build

    - name: Run online mode authentication test
      run: .\build\tests\online_mode_tests.exe -v2
      shell: powershell

    - name: Upload online mode screenshot
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: online-mode-screenshot-windows
        path: build\tests\online-mode-windows-*.png

  # ──────────────────────────────────────────────────────────────────────────
  # Login Screen Full-Application Test – Windows
  #
  # Validates that a user can log into MaximumTrainer and access key
  # functionality without error on Windows (the OS reported in the original
  # login-screen bug):
  #   • Offline login path: account setup logic is exercised end-to-end and
  #     SimulatorHub confirms all four sensor channels (HR, cadence, speed,
  #     power) carry realistic values once logged in.
  #   • Intervals.icu OAuth URL: the OAuth2 authorization URL built by
  #     Environnement is validated for all required parameters (client_id,
  #     response_type, scope, redirect_uri, state).
  #   • Intervals.icu API login (optional): a real HTTPS request is made to
  #     intervals.icu/api/v1 using secrets when available; QSKIP otherwise.
  #   • A labelled 1280×720 screenshot is captured as visual build evidence.
  # ──────────────────────────────────────────────────────────────────────────
  test_login_screen:
    runs-on: windows-latest
    needs: build_windows
    permissions:
      contents: read
    env:
      INTERVALS_ICU_API_KEY:    ${{ secrets.INTERVALS_ICU_API_KEY }}
      INTERVALS_ICU_ATHLETE_ID: ${{ secrets.INTERVALS_ICU_ATHLETE_ID }}

    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: windows
        path: build

    - name: Run login screen test
      run: |
        # Use QTest's -o flag to capture output to file — Tee-Object does not
        # work for Win32 GUI subsystem apps (no console stdout).
        .\build\tests\login_screen_tests.exe -v2 -o build\tests\login-screen-test-output.txt,txt
        exit $LASTEXITCODE
      shell: powershell

    - name: Upload login screen screenshot
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: login-screen-screenshot-windows
        path: |
          build\tests\*-windows-*.png
          build\tests\*dialoglogin*-windows-*.png
          build\tests\login-screen-test-output.txt

  # ──────────────────────────────────────────────────────────────────────────
  # Workout UI Integration Test – Windows
  #
  # Validates the end-to-end workout pipeline on Windows, including:
  #   • User login (offline path)
  #   • Workout XML creation and retrieval (round-trip, lightweight schema)
  #   • Workout model construction and field verification (Workout / Interval)
  #   • Workout XML round-trip via XmlUtil::createWorkoutXml + parseSingleWorkoutXml
  #   • Workout average-power metric (getAveragePower)
  #   • ERG simulation: setLoad and setSlope drive SimulatorHub to the
  #     correct power target without physical Bluetooth hardware
  #   • Workout session lifecycle: start / pause / resume / stop with data
  #     accumulation across all four sensor channels
  #   • Interval advancement: ERG target changes at each interval boundary
  #   • Power-on-target: actual power stays within ±25 % of ERG target
  #   • Network connectivity: HTTPS GET to intervals.icu/api/v1 (QSKIP when
  #     credentials absent)
  #   • Network workout retrieval: GET /athlete/{id}/workouts returns a JSON
  #     array (QSKIP when credentials absent)
  #   • A labelled 1280×720 screenshot with QWT power-curve plot is captured
  #     as visual build evidence
  # ──────────────────────────────────────────────────────────────────────────
  test_workout_ui:
    runs-on: windows-latest
    needs: build_windows
    permissions:
      contents: read
    env:
      INTERVALS_ICU_API_KEY:    ${{ secrets.INTERVALS_ICU_API_KEY }}
      INTERVALS_ICU_ATHLETE_ID: ${{ secrets.INTERVALS_ICU_ATHLETE_ID }}

    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: windows
        path: build

    - name: Run workout UI test
      run: .\build\tests\workout_ui_tests.exe -v2
      shell: powershell

    - name: Upload workout UI screenshot
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: workout-ui-screenshot-windows
        path: build\tests\workout-ui-windows-*.png

  # ──────────────────────────────────────────────────────────────────────────
  # Workout Parsing Tests – Windows
  # ──────────────────────────────────────────────────────────────────────────
  test_workout_parsing:
    runs-on: windows-latest
    needs: build_windows
    permissions:
      contents: read
    env:
      INTERVALS_ICU_API_KEY:    ${{ secrets.INTERVALS_ICU_API_KEY }}
      INTERVALS_ICU_ATHLETE_ID: ${{ secrets.INTERVALS_ICU_ATHLETE_ID }}

    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: windows
        path: build

    - name: Run workout parsing tests
      run: .\build\tests\workout_parsing_tests.exe -v2
      shell: powershell

  # ──────────────────────────────────────────────────────────────────────────
  # UI Navigation Tests – Windows
  # ──────────────────────────────────────────────────────────────────────────
  test_ui_navigation:
    runs-on: windows-latest
    needs: build_windows
    permissions:
      contents: read

    steps:
    - name: Configure OpenAL null audio driver for headless CI
      # On headless Windows Server runners there is no audio endpoint device.
      # SFML's OpenAL-Soft layer (openal32.dll) crashes with
      # STATUS_STACK_BUFFER_OVERRUN when it can't find any mmdevapi endpoint.
      # Pointing ALSOFT_CONF at a config that selects the built-in null driver
      # lets OpenAL initialise cleanly without any audio hardware — no driver
      # install or reboot required.
      run: |
        $confPath = "$env:TEMP\alsoft.conf"
        "[general]`ndrivers=null" | Set-Content -Path $confPath -Encoding ASCII
        Add-Content -Path $env:GITHUB_ENV -Value "ALSOFT_CONF=$confPath"
      shell: powershell

    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: windows
        path: build

    - name: Run UI navigation tests
      # MT_NO_NETWORK=1 disables all outbound network calls in the launched
      # MaximumTrainer binary (radio list, session check, Intervals.icu, etc.).
      # The child process inherits this variable from QProcess automatically.
      # Remove or set to 0 when running locally to keep network enabled.
      env:
        MT_NO_NETWORK: "1"
      run: |
        # Use QTest's -o flag to capture output to file — Tee-Object does not
        # work for Win32 GUI subsystem apps (no console stdout).
        .\build\tests\ui_navigation_tests.exe -v2 -o build\tests\ui-navigation-test-output.txt,txt
        exit $LASTEXITCODE
      shell: powershell

    - name: Print test output
      if: always()
      shell: powershell
      run: |
        $logPath = "build\tests\ui-navigation-test-output.txt"
        if (Test-Path $logPath) {
          Write-Host "=== ui_navigation_tests output ==="
          Get-Content $logPath
        }

    - name: Upload UI navigation screenshots and log
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ui-navigation-screenshots-windows
        path: |
          build\tests\app-journey-*\
          build\tests\ui-navigation-test-output.txt

  # ──────────────────────────────────────────────────────────────────────────
  # UI Screens Tests – Windows
  # ──────────────────────────────────────────────────────────────────────────
  test_ui_screens:
    runs-on: windows-latest
    needs: build_windows
    permissions:
      contents: read

    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: windows
        path: build

    - name: Run UI screens test
      run: .\build\tests\ui_screens_tests.exe -v2
      shell: powershell

    - name: Upload UI screens screenshots
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ui-screens-screenshots-windows
        path: build\tests\ui-screens-*.png

