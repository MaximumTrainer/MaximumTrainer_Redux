name: Build - Windows

on:
  workflow_call:
    inputs:
      tag_name:
        description: 'Release tag to embed as APP_VERSION (e.g. v1.2.3). Falls back to git describe when empty.'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to embed as APP_VERSION (e.g. v1.2.3). Falls back to git describe when empty.'
        required: false
        default: ''

env:
  QT_VERSION: '6.11.1'
  # Retry/timeout tuning for aqtinstall (Qt CDN flakes). No-op in jobs that
  # install Qt without a checkout — aqt ignores a missing config file.
  AQT_CONFIG: ${{ github.workspace }}/.github/aqt-settings.ini

jobs:

  build_windows:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      # Qt installation root - install-qt-action places Qt under $QT_HOME\Qt\$version\$arch.
      # For local Windows builds, set QT_HOME to the parent of your Qt installation
      # (e.g. C:\ if Qt is at C:\Qt\6.11.1\msvc2022_64).
      QT_HOME: C:\Qt
      # Stable QWT install directory used by the cache action and PowerShell build steps.
      QWT_INSTALL_DIR: C:\qwt

    steps:
    - name: MSVC Environment Setup
      uses: ilammy/msvc-dev-cmd@v1

    - name: checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ env.QT_VERSION }}
        # Released aqt can't resolve Qt 6.11's new Windows repo layout (aqtinstall
        # #959); use git master until a fixed release ships.
        aqtversion: ' @ git+https://github.com/miurahr/aqtinstall.git@master'
        arch: win64_msvc2022_64
        modules: 'qtwebengine qtconnectivity qtwebchannel qtpositioning qtmultimedia'
        dir: ${{ env.QT_HOME }}
        cache: true
        cache-key-prefix: qt-win

    - name: Set QTDIR
      run: echo "QTDIR=${{ env.QT_HOME }}\Qt\${{ env.QT_VERSION }}\msvc2022_64" >> $env:GITHUB_ENV
      shell: powershell

    - name: Install jom
      shell: pwsh
      run: |
        # Chocolatey's CDN occasionally returns a 504 and then exits 0 with
        # "Chocolatey installed 0/0 packages" — leaving jom missing, which only
        # surfaces later as "jom : not recognized" in a build step. Retry until
        # jom.exe actually exists, fail fast if it never does, and pin it on PATH.
        $jom = "C:\ProgramData\chocolatey\bin\jom.exe"
        for ($i = 1; $i -le 5 -and -not (Test-Path $jom); $i++) {
          if ($i -gt 1) { Start-Sleep -Seconds 15 }
          Write-Host "Installing jom (attempt $i)..."
          choco install jom -y --no-progress
        }
        if (-not (Test-Path $jom)) {
          throw "jom failed to install after 5 attempts (Chocolatey source issue)"
        }
        "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

    - name: Restore OpenSSL cache
      id: openssl-cache
      uses: actions/cache@v4
      with:
        path: C:\openssl
        key: openssl-3.5.4-win64

    - name: Download OpenSSL 3
      # Qt 6 requires OpenSSL 3.x DLLs (libssl-3-x64.dll / libcrypto-3-x64.dll)
      # for HTTPS/TLS. Download the pre-built FireDaemon distribution rather than
      # relying on aqtinstall's tools catalogue (the tool-name format is unstable
      # across aqt releases).
      if: steps.openssl-cache.outputs.cache-hit != 'true'
      run: |
        curl.exe -L -o "$env:TEMP\openssl.zip" "https://download.firedaemon.com/FireDaemon-OpenSSL/openssl-3.5.4.zip"
        Expand-Archive -Path "$env:TEMP\openssl.zip" -DestinationPath "C:\openssl" -Force
        Write-Host "OpenSSL extracted to C:\openssl"
      shell: powershell

    - name: Set OPENSSL_BIN
      run: |
        $dll = Get-ChildItem "C:\openssl" -Recurse -Filter "libssl-3-x64.dll" |
               Select-Object -First 1
        if (-not $dll) { Write-Error "libssl-3-x64.dll not found in C:\openssl"; exit 1 }
        echo "OPENSSL_BIN=$($dll.DirectoryName)" >> $env:GITHUB_ENV
        Write-Host "OpenSSL DLLs at: $($dll.DirectoryName)"
      shell: powershell


    - name: Restore QWT cache
      id: qwt-cache
      uses: actions/cache@v4
      with:
        path: ${{ env.QWT_INSTALL_DIR }}
        key: qwt-6.3.0-qt-${{ env.QT_VERSION }}-msvc2022-win64

    - name: Validate QWT cache
      id: qwt-validate
      shell: powershell
      # A corrupted cache extraction can leave a partial tree behind while the
      # action still reports a cache hit. Verify the pieces the build links
      # against; rebuild otherwise.
      run: |
        if (("${{ steps.qwt-cache.outputs.cache-hit }}" -eq "true") -and
            (Test-Path "$env:QWT_INSTALL_DIR\lib\qwt.dll") -and
            (Test-Path "$env:QWT_INSTALL_DIR\include\qwt_plot.h")) {
          "ok=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        } else {
          "ok=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if (Test-Path $env:QWT_INSTALL_DIR) { Remove-Item -Recurse -Force $env:QWT_INSTALL_DIR }
        }

    - name: Build QWT
      # No QWT apt/Qt6 binary package exists, so build 6.3.0 from source against
      # the installed Qt6 and install it to QWT_INSTALL_DIR. MaximumTrainer.pro is
      # pointed at this location via QWT_INSTALL=... .
      if: steps.qwt-validate.outputs.ok != 'true'
      run: |
        $qwtInstallDirFwd = $env:QWT_INSTALL_DIR -replace '\\', '/'
        Set-Location ..
        # Use curl.exe -L to follow SourceForge redirects reliably
        curl.exe -L -o "$env:TEMP\qwt.tar.bz2" "https://sourceforge.net/projects/qwt/files/qwt/6.3.0/qwt-6.3.0.tar.bz2/download"
        7z x "$env:TEMP\qwt.tar.bz2" -o"$env:TEMP" -y
        7z x "$env:TEMP\qwt.tar" -o"." -y
        Rename-Item "qwt-6.3.0" "qwt-src"
        Set-Location "qwt-src"
        # Patch every QWT_INSTALL_PREFIX assignment to use the new path
        (Get-Content "qwtconfig.pri") | ForEach-Object {
            if ($_ -match 'QWT_INSTALL_PREFIX\s*=') {
                $_ -replace '(QWT_INSTALL_PREFIX\s*=\s*).*', "`$1$qwtInstallDirFwd"
            } else { $_ }
        } | Set-Content "qwtconfig.pri"
        qmake qwt.pro
        jom /J $env:NUMBER_OF_PROCESSORS
        jom install
      shell: powershell

    - name: Determine build version
      run: |
        $passedTag = "${{ inputs.tag_name }}"
        if ($passedTag -ne '') {
          $tag = $passedTag
          Write-Host "Using passed tag: $tag"
        } else {
          $tag = (git describe --tags --match 'v[0-9]*' --always) -replace '\r','' -replace '-\d+-g[0-9a-f]+$',''
          if (-not ($tag -match '^[vV][0-9]')) { $tag = 'v0.0.0' }
          Write-Host "Using git describe: $tag"
        }
        "GIT_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        Write-Host "Build version: $tag"
      shell: powershell

    - name: Create Makefile
      run: |
        $qwtInstallDirFwd = $env:QWT_INSTALL_DIR -replace '\\','/'
        $env:INTERVALS_OAUTH_CLIENT_ID = "${{ secrets.INTERVALS_OAUTH_CLIENT_ID }}"
        qmake MaximumTrainer.pro `
          "QWT_INSTALL=$qwtInstallDirFwd"
      shell: powershell

    - name: Build
      run: 'jom /J $env:NUMBER_OF_PROCESSORS'
      shell: powershell

    - name: Copy QWT runtime DLL
      # qwt.dll is linked at build time but windeployqt does not know about it.
      # Copy it alongside MaximumTrainer.exe so the build artifact is self-contained
      # and MaximumTrainer.exe can be launched directly from build\release\ without
      # a "qwt.dll not found" loader error.
      run: |
        $qwtDll = "$env:QWT_INSTALL_DIR\lib\qwt.dll"
        if (-not (Test-Path $qwtDll)) {
          Write-Error "qwt.dll not found at expected path: $qwtDll"
          exit 1
        }
        Copy-Item $qwtDll "build\release\" -Force
        Write-Host "Copied qwt.dll to build\release\"

        # qwt.dll itself depends on Qt6OpenGLWidgets.dll, but windeployqt only
        # scans MaximumTrainer.exe's *direct* Qt imports — and the app links
        # Qt6OpenGL / Qt6Svg directly but never Qt6OpenGLWidgets, so that DLL is
        # never deployed. Loading qwt.dll then aborts the process before main()
        # with STATUS_DLL_NOT_FOUND (0xC0000135). Copy it explicitly.
        $openGlWidgets = "$env:QTDIR\bin\Qt6OpenGLWidgets.dll"
        if (-not (Test-Path $openGlWidgets)) {
          Write-Error "Qt6OpenGLWidgets.dll not found at expected path: $openGlWidgets"
          exit 1
        }
        Copy-Item $openGlWidgets "build\release\" -Force
        Write-Host "Copied Qt6OpenGLWidgets.dll to build\release\"
      shell: powershell

    - name: Copy OpenSSL DLLs
      # Qt 6 requires OpenSSL 3.x DLLs for HTTPS/TLS.
      # OPENSSL_BIN is set by the "Locate OpenSSL 3 DLLs" step above.
      run: |
        $opensslBin = "$env:OPENSSL_BIN"
        if (Test-Path $opensslBin) {
          foreach ($dll in @("libssl-3-x64.dll", "libcrypto-3-x64.dll")) {
            $src = "$opensslBin\$dll"
            if (Test-Path $src) {
              Copy-Item $src "build\release\" -Force
              Write-Host "Copied $dll"
            } else {
              Write-Warning "OpenSSL DLL not found: $src"
            }
          }
        } else {
          Write-Warning "OPENSSL_BIN directory not found: $opensslBin"
        }
      shell: powershell

    - name: Deploy Qt for main executable
      run: |
        & "$env:QTDIR\bin\windeployqt.exe" --release `
            --no-translations `
            --no-system-d3d-compiler `
            --qmldir src\game\qml `
            build\release\MaximumTrainer.exe
      shell: powershell

    - name: Copy QtMultimedia FFmpeg backend DLLs
      # Qt 6.7's QtMultimedia uses the FFmpeg backend by default. windeployqt
      # copies the multimedia plugin but NOT the FFmpeg runtime DLLs it depends
      # on (avcodec/avformat/avutil/swresample/swscale), so the app fails to
      # start with STATUS_DLL_NOT_FOUND (0xC0000135) the moment a QMediaPlayer
      # is constructed. Copy them from the Qt bin directory explicitly.
      run: |
        $ffmpeg = Get-ChildItem "$env:QTDIR\bin" -Filter "*.dll" |
                  Where-Object { $_.Name -match '^(avcodec|avformat|avutil|swresample|swscale|avdevice|avfilter|postproc)' }
        if ($ffmpeg.Count -eq 0) {
          Write-Warning "No FFmpeg DLLs found in $env:QTDIR\bin"
        }
        foreach ($dll in $ffmpeg) {
          Copy-Item $dll.FullName "build\release\" -Force
          Write-Host "Copied $($dll.Name)"
        }
      shell: powershell

    - name: Build runtime validation test
      run: |
        New-Item -ItemType Directory -Force -Path build\tests | Out-Null
        Set-Location tests\integration
        qmake runtime_validation_tests.pro
        jom /J $env:NUMBER_OF_PROCESSORS
      shell: powershell

    - name: Build BLE API smoke test
      run: |
        New-Item -ItemType Directory -Force -Path build\tests | Out-Null
        Set-Location tests\integration
        qmake btle_api_tests.pro
        jom /J $env:NUMBER_OF_PROCESSORS
      shell: powershell

    - name: Build offline mode test
      run: |
        New-Item -ItemType Directory -Force -Path build\tests | Out-Null
        Set-Location tests\integration
        qmake offline_mode_tests.pro
        jom /J $env:NUMBER_OF_PROCESSORS
      shell: powershell

    - name: Build online mode test
      run: |
        New-Item -ItemType Directory -Force -Path build\tests | Out-Null
        Set-Location tests\integration
        qmake online_mode_tests.pro
        jom /J $env:NUMBER_OF_PROCESSORS
      shell: powershell

    - name: Build login screen test
      run: |
        New-Item -ItemType Directory -Force -Path build\tests | Out-Null
        Set-Location tests\integration
        $qwtDirFwd = $env:QWT_INSTALL_DIR -replace '\\','/'
        qmake login_screen_tests.pro "QWT_INSTALL=$qwtDirFwd"
        jom /J $env:NUMBER_OF_PROCESSORS
      shell: powershell

    - name: Build workout UI test
      run: |
        New-Item -ItemType Directory -Force -Path build\tests | Out-Null
        Set-Location tests\integration
        $qwtDirFwd = $env:QWT_INSTALL_DIR -replace '\\','/'
        qmake workout_ui_tests.pro "QWT_INSTALL=$qwtDirFwd"
        jom /J $env:NUMBER_OF_PROCESSORS
      shell: powershell

    - name: Build workout parsing test
      run: |
        New-Item -ItemType Directory -Force -Path build\tests | Out-Null
        Set-Location tests\integration
        qmake workout_parsing_tests.pro
        jom /J $env:NUMBER_OF_PROCESSORS
      shell: powershell

    - name: Build UI navigation test
      run: |
        New-Item -ItemType Directory -Force -Path build\tests | Out-Null
        Set-Location tests\integration
        $qwtDirFwd = $env:QWT_INSTALL_DIR -replace '\\','/'
        qmake ui_navigation_tests.pro "QWT_INSTALL=$qwtDirFwd"
        jom /J $env:NUMBER_OF_PROCESSORS
      shell: powershell

    - name: Build UI screens test
      run: |
        New-Item -ItemType Directory -Force -Path build\tests | Out-Null
        Set-Location tests\integration
        $qwtDirFwd = $env:QWT_INSTALL_DIR -replace '\\','/'
        qmake ui_screens_tests.pro "QWT_INSTALL=$qwtDirFwd"
        jom /J $env:NUMBER_OF_PROCESSORS
      shell: powershell

    - name: Build workout I/O test
      run: |
        New-Item -ItemType Directory -Force -Path build\tests | Out-Null
        Set-Location tests\integration
        $qwtDirFwd = $env:QWT_INSTALL_DIR -replace '\\','/'
        qmake workout_io_tests.pro "QWT_INSTALL=$qwtDirFwd"
        jom /J $env:NUMBER_OF_PROCESSORS
      shell: powershell

    - name: Build workout creator test
      run: |
        New-Item -ItemType Directory -Force -Path build\tests | Out-Null
        Set-Location tests\integration
        qmake workout_creator_tests.pro
        jom /J $env:NUMBER_OF_PROCESSORS
      shell: powershell

    - name: Build Intervals.icu live integration test
      run: |
        New-Item -ItemType Directory -Force -Path build\tests | Out-Null
        Set-Location tests\intervals_icu_integration
        qmake intervals_icu_integration_tests.pro
        jom /J $env:NUMBER_OF_PROCESSORS
      shell: powershell

    - name: Deploy Qt for test binaries
      run: |
        $tests = @(
          "runtime_validation_tests", "btle_api_tests", "offline_mode_tests",
          "online_mode_tests", "login_screen_tests", "workout_ui_tests",
          "workout_parsing_tests", "ui_navigation_tests", "ui_screens_tests",
          "workout_io_tests", "workout_creator_tests",
          "intervals_icu_integration_tests"
        )
        foreach ($t in $tests) {
          $exe = "build\tests\$t.exe"
          if (Test-Path $exe) {
            & "$env:QTDIR\bin\windeployqt.exe" --release `
                --no-translations `
                --no-system-d3d-compiler `
                $exe
          }
        }
        foreach ($dll in @("libssl-3-x64.dll", "libcrypto-3-x64.dll")) {
          $src = "$env:OPENSSL_BIN\$dll"
          if (Test-Path $src) { Copy-Item $src "build\tests\" -Force }
        }
        # qwt.dll is a third-party DLL not discovered by windeployqt when it
        # scans the test executables (it resolves direct Qt imports only); any
        # test binary that instantiates QwtPlot/QwtPlotCurve fails to load
        # without it.  Copy it alongside the test executables, then run
        # windeployqt ON qwt.dll so its own Qt dependency set (Qt6OpenGL,
        # Qt6OpenGLWidgets, Qt6PrintSupport, …) is deployed too.  Those DLLs
        # previously arrived only as a side effect of login_screen_tests
        # linking QtWebEngine; when that dependency was dropped (#261),
        # workout_ui_tests started aborting at load with 0xC0000135
        # (STATUS_DLL_NOT_FOUND).
        $qwtDll = "$env:QWT_INSTALL_DIR\lib\qwt.dll"
        if (Test-Path $qwtDll) {
          Copy-Item $qwtDll "build\tests\" -Force
          Write-Host "Copied qwt.dll to build\tests\"
          & "$env:QTDIR\bin\windeployqt.exe" --release `
              --no-translations `
              --no-system-d3d-compiler `
              "build\tests\qwt.dll"
        } else {
          Write-Warning "qwt.dll not found at $qwtDll - workout_ui_tests may fail to load"
        }
        # FFmpeg DLLs for the QtMultimedia backend: tests that construct a
        # WorkoutDialog (workout_ui_tests) or launch MaximumTrainer.exe
        # (ui_navigation_tests) create a QMediaPlayer and need these at load
        # time, but windeployqt does not copy them.
        $ffmpeg = Get-ChildItem "$env:QTDIR\bin" -Filter "*.dll" |
                  Where-Object { $_.Name -match '^(avcodec|avformat|avutil|swresample|swscale|avdevice|avfilter|postproc)' }
        foreach ($dll in $ffmpeg) {
          Copy-Item $dll.FullName "build\tests\" -Force
          Write-Host "Copied $($dll.Name) to build\tests\"
        }
      shell: powershell

    - name: Upload artifact
      # Exclude compile intermediates (~3/4 of build/): the test and release
      # jobs only need the binaries and deployed DLLs, and every one of them
      # downloads this.
      uses: actions/upload-artifact@v4
      with:
        name: windows
        path: |
          build/
          !build/release/.obj/**
          !build/release/.moc/**
          !build/release/.qrc/**
          !build/release/.u/**

  # ──────────────────────────────────────────────────────────────────────────
  # Headless Test Suites (Windows) — consolidated (#352)
  #
  # One runner for every suite that needs no window, running the pre-built,
  # windeployqt'd binaries from the build artifact — no Qt installation at
  # all in this job. Covers BLE API smoke, workout I/O, workout creator,
  # workout parsing, and the live Intervals.icu integration suite
  # (secrets-gated cases QSKIP without credentials).
  # ──────────────────────────────────────────────────────────────────────────
  test_headless_suites:
    runs-on: windows-latest
    needs: build_windows
    permissions:
      contents: read
    env:
      INTERVALS_ICU_API_KEY:    ${{ secrets.INTERVALS_ICU_API_KEY }}
      INTERVALS_ICU_ATHLETE_ID: ${{ secrets.INTERVALS_ICU_ATHLETE_ID }}

    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: windows
        path: build

    - name: BLE API smoke test
      run: .\build\tests\btle_api_tests.exe -v2
      shell: powershell

    - name: Workout I/O tests
      run: .\build\tests\workout_io_tests.exe -v2
      shell: powershell

    - name: Workout creator tests
      run: .\build\tests\workout_creator_tests.exe -v2
      shell: powershell

    - name: Workout parsing tests
      run: .\build\tests\workout_parsing_tests.exe -v2
      shell: powershell

    - name: Run Intervals.icu live integration tests
      shell: powershell
      run: |
        # Live test against intervals.icu: retry transient network/API blips
        # before failing the job. QtTest's stdout is swallowed on the Windows
        # runner, so -o writes results to a file we echo into the log — failures
        # stay diagnosable instead of surfacing as a bare "exit code 1".
        $attempts = 3
        for ($i = 1; $i -le $attempts; $i++) {
          Write-Host "::group::Intervals.icu integration tests (attempt $i/$attempts)"
          & .\build\tests\intervals_icu_integration_tests.exe -v2 -o "results.txt,txt"
          $code = $LASTEXITCODE
          if (Test-Path results.txt) { Get-Content results.txt }
          Write-Host "::endgroup::"
          if ($code -eq 0) { Write-Host "Passed on attempt $i."; exit 0 }
          Write-Host "Attempt $i failed with exit code $code."
          if ($i -lt $attempts) { Start-Sleep -Seconds ($i * 15) }
        }
        Write-Host "::error::Intervals.icu integration tests failed after $attempts attempts (likely a transient intervals.icu/network issue if no assertion appears above)."
        exit 1

  # ──────────────────────────────────────────────────────────────────────────
  # GUI Integration Tests (Windows) — consolidated (#352)
  #
  # One runner for the windowed suites that need no secrets, running the
  # pre-built binaries from the build artifact (no Qt installation): runtime
  # validation, offline mode, UI screens, and UI navigation (which launches
  # the real MaximumTrainer.exe). Screenshot evidence from every suite is
  # uploaded as one artifact.
  # ──────────────────────────────────────────────────────────────────────────
  test_gui:
    runs-on: windows-latest
    needs: build_windows
    permissions:
      contents: read

    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: windows
        path: build

    - name: Runtime validation test
      run: .\build\tests\runtime_validation_tests.exe -v2
      shell: powershell

    - name: Offline mode test
      run: .\build\tests\offline_mode_tests.exe -v2
      shell: powershell

    - name: UI screens test
      run: .\build\tests\ui_screens_tests.exe -v2
      shell: powershell

    - name: UI navigation tests
      # MT_NO_NETWORK=1 disables all outbound network calls in the launched
      # MaximumTrainer binary (radio list, session check, Intervals.icu, etc.).
      # The child process inherits this variable from QProcess automatically.
      env:
        MT_NO_NETWORK: "1"
      run: |
        # Use QTest's -o flag to capture output to file — Tee-Object does not
        # work for Win32 GUI subsystem apps (no console stdout).
        .\build\tests\ui_navigation_tests.exe -v2 -o build\tests\ui-navigation-test-output.txt,txt
        exit $LASTEXITCODE
      shell: powershell

    - name: Print UI navigation test output
      if: always()
      shell: powershell
      run: |
        $logPath = "build\tests\ui-navigation-test-output.txt"
        if (Test-Path $logPath) {
          Write-Host "=== ui_navigation_tests output ==="
          Get-Content $logPath
        }

    - name: Upload GUI test evidence
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: gui-test-artifacts-windows
        path: |
          build\tests\screenshot-windows-*.png
          build\tests\offline-mode-windows-*.png
          build\tests\activity-windows-*.tsv
          build\tests\ui-screens-*.png
          build\tests\app-journey-*\
          build\tests\ui-navigation-test-output.txt

  # ──────────────────────────────────────────────────────────────────────────
  # Live GUI Tests (Windows + Intervals.icu secrets) — consolidated (#352)
  #
  # The three windowed suites that talk to the live intervals.icu API: online
  # mode, workout UI, and the login screen full-application journey. Kept
  # separate from test_gui so a flaky live run retries cheaply. Tests QSKIP
  # gracefully when the secrets are absent (fork PRs).
  # ──────────────────────────────────────────────────────────────────────────
  test_gui_live:
    runs-on: windows-latest
    needs: build_windows
    permissions:
      contents: read
    env:
      INTERVALS_ICU_API_KEY:    ${{ secrets.INTERVALS_ICU_API_KEY }}
      INTERVALS_ICU_ATHLETE_ID: ${{ secrets.INTERVALS_ICU_ATHLETE_ID }}

    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: windows
        path: build

    - name: Online mode authentication test
      run: .\build\tests\online_mode_tests.exe -v2
      shell: powershell

    # QTest stdout from Windows GUI-subsystem processes is not reliably
    # captured by the runner; write results to a file and print it so
    # failures are diagnosable from the log.
    - name: Workout UI test
      run: |
        .\build\tests\workout_ui_tests.exe -v2 -o workout_ui_results.txt,txt
        $code = $LASTEXITCODE
        Write-Host "QTest exit code: $code"
        if (Test-Path workout_ui_results.txt) { Get-Content workout_ui_results.txt }
        exit $code
      shell: powershell

    - name: Login screen test
      run: |
        # Use QTest's -o flag to capture output to file — Tee-Object does not
        # work for Win32 GUI subsystem apps (no console stdout).
        .\build\tests\login_screen_tests.exe -v2 -o build\tests\login-screen-test-output.txt,txt
        exit $LASTEXITCODE
      shell: powershell

    - name: Upload live GUI test evidence
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: gui-live-test-artifacts-windows
        path: |
          build\tests\online-mode-windows-*.png
          build\tests\workout-ui-windows-*.png
          build\tests\*-windows-*.png
          build\tests\login-screen-test-output.txt
