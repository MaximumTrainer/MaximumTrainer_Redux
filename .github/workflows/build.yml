name: Build Workflow

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]  # tag pushes are handled by release.yml, not build.yml
    # docs/** is the GitHub Pages site, deployed by pages.yml. Skipping it here
    # mainly stops the publish job's own "deploy Wasm artifacts" commit from
    # triggering another full build (and minting another release) every time.
    paths-ignore: ['docs/**']
  # Build PRs targeting master so cross-platform breakage is caught before merge.
  # Same-repo branches already build via the push event above, so the build jobs
  # below run on pull_request ONLY for FORK PRs (whose branches don't push to
  # this repo) — see the per-job `if`. compute_version is master-only and skipped
  # here.
  pull_request:
    branches: [master]

# Auto-cancel superseded runs within an event+branch: a new push cancels the
# older in-flight push run, so rapid iteration only pays for the latest commit.
# The event name is part of the group so the push and pull_request runs do NOT
# cancel each other — an upstream branch with an open PR fires both, and they
# must coexist (the same-repo pull_request run no-ops via the per-job `if`, so
# there's no wasted compute and no cancelled run left showing red on the PR).
# Master is never cancelled so every release build completes.
concurrency:
  group: build-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:

  # ──────────────────────────────────────────────────────────────────────────
  # Compute the next semantic version on master BEFORE the builds so that the
  # compiled binaries embed the correct release tag rather than the previous
  # one.  On non-master branches this job is skipped and the build jobs fall
  # back to `git describe` for a best-effort informational version string.
  # Serialised so that concurrent master pushes don't race on the same version.
  # ──────────────────────────────────────────────────────────────────────────
  compute_version:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.semver.outputs.new_tag }}
    concurrency:
      group: tag_release
      cancel-in-progress: false

    steps:
    - name: Checkout with full tag history
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Compute next semantic version
      id: semver
      run: |
        # Find the latest tag that looks like vMAJOR.MINOR.PATCH; default to v0.0.0
        latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n1)
        if [ -z "$latest" ]; then
          latest="v0.0.0"
        fi
        echo "Latest tag: $latest"
        version="${latest#v}"
        major=$(echo "$version" | cut -d. -f1)
        minor=$(echo "$version" | cut -d. -f2)
        patch=$(echo "$version" | cut -d. -f3)
        patch=$((patch + 1))
        new_tag="v${major}.${minor}.${patch}"
        echo "New tag: $new_tag"
        echo "new_tag=$new_tag" >> "$GITHUB_OUTPUT"

    - name: Create and push tag
      run: |
        # Create the git tag so that publish and verify_assets can reference it.
        # Check the remote directly so re-runs (where the tag was already pushed
        # in a previous attempt) skip tag creation rather than failing.
        new_tag="${{ steps.semver.outputs.new_tag }}"
        if git ls-remote --tags origin "$new_tag" | grep -q "$new_tag"; then
          echo "Tag $new_tag already exists on origin — skipping creation"
        else
          git tag "$new_tag"
          git push origin "$new_tag"
          echo "Created and pushed tag $new_tag"
        fi

  # ──────────────────────────────────────────────────────────────────────────
  # Linux build + BTLE integration test (defined in build-linux.yml)
  # Runs after compute_version so the correct release tag can be passed as
  # an input and embedded in the binary.  `if: always()` ensures the build
  # also runs on non-master branches where compute_version is skipped.
  # ──────────────────────────────────────────────────────────────────────────
  build_linux:
    needs: [compute_version]
    # Run on push, or on pull_request only for fork PRs (same-repo PRs already
    # built via push). always() keeps it running when compute_version is skipped.
    if: ${{ always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository) }}
    uses: ./.github/workflows/build-linux.yml
    with:
      tag_name: ${{ needs.compute_version.outputs.new_tag }}
    permissions:
      contents: read
    secrets: inherit

  # ──────────────────────────────────────────────────────────────────────────
  # Windows build (defined in build-windows.yml)
  # ──────────────────────────────────────────────────────────────────────────
  build_windows:
    needs: [compute_version]
    if: ${{ always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository) }}
    uses: ./.github/workflows/build-windows.yml
    with:
      tag_name: ${{ needs.compute_version.outputs.new_tag }}
    permissions:
      contents: read
    secrets: inherit

  # ──────────────────────────────────────────────────────────────────────────
  # macOS build (defined in build-mac.yml)
  # ──────────────────────────────────────────────────────────────────────────
  build_mac:
    needs: [compute_version]
    if: ${{ always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository) }}
    uses: ./.github/workflows/build-mac.yml
    with:
      tag_name: ${{ needs.compute_version.outputs.new_tag }}
    permissions:
      contents: read
    secrets: inherit

  # ──────────────────────────────────────────────────────────────────────────
  # WASM build (best-effort — runs on every push so WASM issues surface early,
  # but failures do not block tag_release or any other job).
  # Steps are kept in sync with the build_wasm job in release.yml.
  # ──────────────────────────────────────────────────────────────────────────
  build_wasm:
    needs: [compute_version]
    if: ${{ always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: ubuntu-22.04
    continue-on-error: true
    permissions:
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        # Qt's WASM build is ABI-locked to the Emscripten it was compiled with;
        # Qt 6.11.x targets Emscripten 4.0.7. It must match or linking against
        # Qt's libqwasm.a fails (Emscripten gives no cross-version ABI guarantee).
        version: '4.0.7'

    - name: Install Qt (Wasm singlethread)
      # v4 required: host=all_os / target=wasm (Qt 6.11's WASM repo path) is
      # rejected by v3, which only allows windows/mac/linux hosts.
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.11.1'
        # Released aqt 3.1.x can't resolve Qt 6.11's reorganised repo; 3.3.0 does.
        aqtversion: '==3.3.0'
        # Qt 6.11 moved WASM out of linux/desktop into the all_os/wasm repo path.
        host: 'all_os'
        target: 'wasm'
        arch: 'wasm_singlethread'
        modules: 'qtwebchannel'
        cache: true
        cache-key-prefix: qt-wasm
        # --autodesktop (v4) auto-installs the matching linux gcc_64 desktop Qt
        # and sets QT_HOST_PATH, so no separate host-tools install step is needed.

    - name: Restore QWT cache (Wasm)
      id: qwt-wasm-cache
      uses: actions/cache@v4
      with:
        path: ~/qwt-wasm
        key: qwt-6.3.0-qt-6.11.1-wasm-em4.0.7

    - name: Build QWT (Wasm)
      if: steps.qwt-wasm-cache.outputs.cache-hit != 'true'
      run: |
        cd /tmp
        curl -L -o qwt.tar.bz2 "https://sourceforge.net/projects/qwt/files/qwt/6.3.0/qwt-6.3.0.tar.bz2/download"
        tar -xjf qwt.tar.bz2
        cd qwt-6.3.0
        source "$EMSDK/emsdk_env.sh"
        sed -i "s|QWT_INSTALL_PREFIX[^=]*=.*|QWT_INSTALL_PREFIX = $HOME/qwt-wasm|" qwtconfig.pri
        for feat in QwtDll QwtFramework QwtSvg QwtOpenGL QwtDesigner QwtDesignerSelfContained \
                    QwtExamples QwtPlayground QwtTests QwtConcurrent; do
          echo "QWT_CONFIG -= $feat" >> qwtconfig.pri
        done
        find . \( -name "*.pro" -o -name "*.pri" \) -print0 | \
          xargs -0 sed -i \
            -e '/QT[[:space:]]*+=/s/\bconcurrent\b//g' \
            -e '/QT[[:space:]]*+=/s/\bopengl\b//g' \
            -e '/QT[[:space:]]*+=/s/\bsvg\b//g'
        echo "DEFINES += QWT_NO_CONCURRENT" >> qwtconfig.pri
        echo "DEFINES += QT_NO_QFUTURE"    >> qwtconfig.pri
        find src -name "*.cpp" -print0 | xargs -0 sed -i \
          's|#include <qfuture\.h>|#ifndef QWT_NO_CONCURRENT\n#include <qfuture.h>\n#endif|g'
        find src -name "*.cpp" -print0 | xargs -0 sed -i \
          's|#include <qtconcurrentrun\.h>|#ifndef QWT_NO_CONCURRENT\n#include <qtconcurrentrun.h>\n#endif|g'
        sed -i \
          '/#include <qthread\.h>/a #include <qmap.h>' \
          src/qwt_plot_spectrogram.cpp
        echo "--- patched includes in concurrent-using files ---"
        grep -rn "QWT_NO_CONCURRENT\|qfuture\|qtconcurrentrun" src/*.cpp | grep -v "^Binary"
        qmake qwt.pro
        emmake make -j$(nproc)
        make install

    - name: Determine build version
      run: |
        NEW_TAG="${{ needs.compute_version.outputs.new_tag }}"
        if [ -n "$NEW_TAG" ]; then
          GIT_TAG="$NEW_TAG"
          echo "Using computed version: $GIT_TAG"
        else
          GIT_TAG=$(git describe --tags --match 'v[0-9]*' --always | tr -d '\r' | sed 's/-[0-9]*-g[0-9a-f]*$//')
          [[ "$GIT_TAG" =~ ^[vV][0-9] ]] || GIT_TAG="v0.0.0"
          echo "Using git describe: $GIT_TAG"
        fi
        echo "Build version: $GIT_TAG"
        echo "GIT_TAG=$GIT_TAG" >> "$GITHUB_ENV"

    - name: Build MaximumTrainer (Wasm)
      run: |
        source "$EMSDK/emsdk_env.sh"
        export QMAKEFEATURES="$HOME/qwt-wasm/features"
        mkdir -p build-wasm && cd build-wasm
        qmake ../MaximumTrainer.pro \
          "QWT_INSTALL=$HOME/qwt-wasm"
        emmake make -j$(nproc)

    - name: Upload Wasm artifact
      uses: actions/upload-artifact@v4
      with:
        name: wasm
        path: |
          build-wasm/build/release/MaximumTrainer.wasm
          build-wasm/build/release/MaximumTrainer.js
          build-wasm/build/release/qtloader.js
          build-wasm/build/release/qtlogo.svg

  # ──────────────────────────────────────────────────────────────────────────
  # Playwright E2E Tests — served locally from docs/ using the freshly built
  # WASM artifact so that tests are independent of the GitHub Pages deployment.
  #
  # The job depends on build_wasm so that the fresh WASM binary is available
  # as an artifact.  If the WASM build failed its artifact is absent; the
  # download step is marked continue-on-error so testing still proceeds with
  # the committed binary already present in docs/app/.
  #
  # Layer A tests verify UI structure (tabs, widgets) without credentials.
  # Layer B tests inject Intervals.icu credentials and verify the calendar/
  # workout list renders; they skip gracefully when secrets are absent.
  #
  # wasm_login_verification.spec.js additionally validates the complete
  # Intervals.icu login flow:
  #   • Node.js call to the real API proves the secrets are valid.
  #   • WASM route interception confirms the app emits the correct
  #     Authorization header from the injected credentials.
  # Layer B login-verification tests skip gracefully on fork PRs; on master
  # (secrets present) they MUST pass — a failed login fails the suite.
  # ──────────────────────────────────────────────────────────────────────────
  test_playwright:
    needs: [build_wasm]
    # build_wasm runs via `if: always()` because its dependency compute_version
    # is skipped on non-master branches; that skipped state otherwise propagates
    # through the implicit success() check and skips this job even when build_wasm
    # succeeded. `!cancelled()` runs the suite regardless of the wasm build's
    # outcome (the download step below falls back to the committed binary).
    # As with the build jobs, run on push or fork PRs only (same-repo PRs build
    # via push) so a same-repo PR doesn't double-run / leave a cancelled job red.
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      INTERVALS_ICU_API_KEY:    ${{ secrets.INTERVALS_ICU_API_KEY }}
      INTERVALS_ICU_ATHLETE_ID: ${{ secrets.INTERVALS_ICU_ATHLETE_ID }}
      PLAYWRIGHT_BASE_URL: http://localhost:8080

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download fresh WASM artifact
      id: download-wasm
      uses: actions/download-artifact@v4
      continue-on-error: true   # wasm build may have failed — fall back to committed binary
      with:
        name: wasm
        path: /tmp/wasm-artifact

    - name: Copy fresh WASM files into docs/app
      if: steps.download-wasm.outcome == 'success'
      run: |
        echo "Downloaded artifact contents:"
        find /tmp/wasm-artifact -maxdepth 3 -type f | sort
        cp /tmp/wasm-artifact/MaximumTrainer.wasm docs/app/
        cp /tmp/wasm-artifact/MaximumTrainer.js   docs/app/
        [ -f /tmp/wasm-artifact/qtloader.js ] && cp /tmp/wasm-artifact/qtloader.js docs/app/ || true
        [ -f /tmp/wasm-artifact/qtlogo.svg ]  && cp /tmp/wasm-artifact/qtlogo.svg  docs/app/ || true

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Playwright and browsers
      run: |
        npm install --no-save @playwright/test pngjs
        npx playwright install chromium --with-deps

    - name: Start local HTTP server
      run: |
        python3 -m http.server 8080 --directory docs &
        # Wait until the server is ready
        timeout 15 bash -c 'until curl -sf http://localhost:8080 > /dev/null; do sleep 1; done' \
          || { echo "Failed to start local server on port 8080"; exit 1; }

    - name: Run Playwright tests
      run: npx playwright test

    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/

    - name: Upload WASM verification screenshots
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: wasm-verification-screenshots
        path: test-results/wasm-screenshots/
        if-no-files-found: warn

  # ──────────────────────────────────────────────────────────────────────────
  # Package jobs — produce release-ready artifacts (AppImage, zip, MSI, dmg,
  # wasm zip) by calling the existing reusable release-*.yml workflows.
  # Each job passes github.run_id as build_run_id so artifact downloads stay
  # within this workflow run — no cross-run lookup needed.
  # Package jobs depend on both compute_version (for the tag) and the
  # respective build job (to ensure the artifact is available before download).
  # ──────────────────────────────────────────────────────────────────────────
  package_linux:
    needs: [compute_version, build_linux]
    uses: ./.github/workflows/release-linux.yml
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      actions: read
    with:
      build_run_id: ${{ github.run_id }}

  package_windows:
    needs: [compute_version, build_windows]
    uses: ./.github/workflows/release-windows.yml
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      actions: read
    with:
      tag_name: ${{ needs.compute_version.outputs.new_tag }}
      build_run_id: ${{ github.run_id }}

  package_mac:
    needs: [compute_version, build_mac]
    uses: ./.github/workflows/release-mac.yml
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      actions: read
    with:
      build_run_id: ${{ github.run_id }}

  package_wasm:
    needs: [compute_version, build_wasm]
    uses: ./.github/workflows/release-wasm.yml
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      actions: read
    with:
      build_run_id: ${{ github.run_id }}

  # ──────────────────────────────────────────────────────────────────────────
  # Publish — create the GitHub Release and deploy WASM files to docs/app/.
  # Runs whenever the three main platform packages succeed, even if WASM failed.
  # ──────────────────────────────────────────────────────────────────────────
  publish:
    needs: [compute_version, package_linux, package_windows, package_mac, package_wasm]
    runs-on: ubuntu-latest
    if: |
      always() &&
      github.ref == 'refs/heads/master' &&
      needs.package_linux.result == 'success' &&
      needs.package_windows.result == 'success' &&
      needs.package_mac.result == 'success'
    permissions:
      contents: write

    steps:
    - name: Download Linux AppImage
      uses: actions/download-artifact@v4
      with:
        name: linux-appimage

    - name: Download Windows zip
      uses: actions/download-artifact@v4
      with:
        name: windows-zip

    - name: Download Windows MSI
      uses: actions/download-artifact@v4
      with:
        name: windows-msi

    - name: Download macOS dmg
      uses: actions/download-artifact@v4
      with:
        name: macos-dmg

    - name: Download Wasm zip
      id: download_wasm
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        name: wasm-zip

    - name: Checkout repo (for docs/app deploy)
      uses: actions/checkout@v4
      with:
        path: repo
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Deploy Wasm files to docs/app/
      if: steps.download_wasm.outcome == 'success'
      run: |
        cd repo
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        # master moves while this run is in flight (any merge during the ~40 min
        # pipeline), so a plain push fails non-fast-forward. This deploy is a pure
        # overwrite of docs/app with the freshly built artifacts, so on a rejected
        # push we hard-reset to current origin/master and re-apply the artifacts —
        # NOT `git pull --rebase`: git can't merge the binary MaximumTrainer.wasm,
        # so a concurrent deploy dead-conflicts the rebase (the bug this replaces).
        for attempt in 1 2 3; do
          git fetch origin master
          git reset --hard origin/master
          mkdir -p docs/app
          unzip -o ../MaximumTrainer-wasm.zip -d docs/app/
          git add docs/app/
          if git diff --cached --quiet; then
            echo "docs/app already up to date — nothing to deploy"
            exit 0
          fi
          git commit -m "chore: deploy Wasm build artifacts for ${{ needs.compute_version.outputs.new_tag }}"
          git push origin HEAD:refs/heads/master && exit 0
          echo "Push rejected (attempt $attempt) — re-syncing to origin/master and retrying"
        done
        echo "::error::Wasm deploy could not push after 3 attempts"
        exit 1

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.compute_version.outputs.new_tag }}
        generate_release_notes: true
        fail_on_unmatched_files: false
        # Don't try to delete/overwrite existing assets - attempting to delete
        # assets from an immutable release causes a fatal API error.
        overwrite_files: false
        files: |
          MaximumTrainer-linux-x86_64.AppImage
          MaximumTrainer-windows-x64.zip
          MaximumTrainer-windows-x64.msi
          MaximumTrainer-macos.dmg
          MaximumTrainer-wasm.zip

  # ──────────────────────────────────────────────────────────────────────────
  # Verify — smoke-test that all required release assets are downloadable.
  # ──────────────────────────────────────────────────────────────────────────
  verify_assets:
    needs: [compute_version, publish]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && needs.publish.result == 'success'
    permissions:
      contents: read
    env:
      TAG: ${{ needs.compute_version.outputs.new_tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - name: Verify release assets are downloadable
      run: |
        REPO="${{ github.repository }}"
        mkdir -p /tmp/release-assets
        cd /tmp/release-assets

        echo "Verifying release assets for tag: $TAG"

        # Required assets – the job fails if any of these are missing or empty
        REQUIRED=(
          "MaximumTrainer-linux-x86_64.AppImage"
          "MaximumTrainer-windows-x64.zip"
          "MaximumTrainer-windows-x64.msi"
          "MaximumTrainer-macos.dmg"
        )

        for asset in "${REQUIRED[@]}"; do
          echo "Downloading $asset ..."
          gh release download "$TAG" --repo "$REPO" --pattern "$asset"
          if [ ! -s "$asset" ]; then
            echo "ERROR: $asset is missing or empty in release $TAG"
            exit 1
          fi
          SIZE=$(stat -c%s "$asset")
          echo "✓ $asset  (${SIZE} bytes)"
        done

        # WASM asset is best-effort: warn but do not fail if absent
        echo "Checking optional WASM asset ..."
        if gh release download "$TAG" --repo "$REPO" --pattern "MaximumTrainer-wasm.zip" 2>/dev/null; then
          if [ -s "MaximumTrainer-wasm.zip" ]; then
            SIZE=$(stat -c%s "MaximumTrainer-wasm.zip")
            echo "✓ MaximumTrainer-wasm.zip  (${SIZE} bytes)"
          else
            echo "WARNING: MaximumTrainer-wasm.zip is present but empty"
          fi
        else
          echo "NOTE: MaximumTrainer-wasm.zip not found in release (Wasm build is best-effort)"
        fi

        echo ""
        echo "All required release assets are present and downloadable."
