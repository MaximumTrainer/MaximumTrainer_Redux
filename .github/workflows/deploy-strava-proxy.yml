name: Deploy strava-token-proxy Worker

on:
  push:
    branches: [master]
    paths:
      - 'workers/strava-token-proxy/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy worker
        id: deploy
        working-directory: workers/strava-token-proxy
        # --config pinned: wrangler v4 can otherwise resolve the repo-root
        # wrangler.jsonc (the docs static site) and deploy THAT over the worker.
        run: |
          DEPLOY_OUTPUT=$(npx wrangler deploy --config wrangler.toml 2>&1)
          echo "$DEPLOY_OUTPUT"
          WORKER_URL=$(echo "$DEPLOY_OUTPUT" | grep -oE 'https://[^[:space:]]+\.workers\.dev' | head -n1)
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Strava requires the client_secret for both the authorization_code
      # exchange and the refresh.  Install it as a Worker secret so the worker
      # injects it server-side and no app binary has to carry it.
      - name: Install Strava client_secret on the worker
        working-directory: workers/strava-token-proxy
        run: |
          if [ -z "$STRAVA_CLIENT_SECRET" ]; then
            echo "STRAVA_CLIENT_SECRET secret not configured — the worker will"
            echo "answer worker_misconfigured and the Strava link cannot work."
            exit 0
          fi
          printf '%s' "$STRAVA_CLIENT_SECRET" | npx wrangler secret put STRAVA_CLIENT_SECRET --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}

      # A bogus code with the real credentials must come back from Strava as
      # HTTP 400 ("Bad Request" — creds accepted, code rejected).  401 means
      # the installed client_secret is wrong; worker_misconfigured means the
      # secret is missing; an empty 404 means the worker is not deployed.
      - name: Verify deployed worker exchanges with Strava
        run: |
          WORKER_URL="${{ steps.deploy.outputs.worker_url }}"
          if [ -z "$WORKER_URL" ]; then
            echo "Could not determine worker URL from wrangler output"; exit 1
          fi
          STATUS=$(curl -s --compressed -o /tmp/body -w '%{http_code}' -X POST "$WORKER_URL/strava/oauth/token" \
            -H 'X-MT-Client: desktop' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            -d 'grant_type=authorization_code&code=ci-verify&redirect_uri=http://localhost:1/')
          echo "HTTP $STATUS — $(cat /tmp/body)"
          if [ "$STATUS" != "400" ]; then
            echo "FAIL — expected HTTP 400 from Strava (credentials accepted, bogus code rejected)"
            exit 1
          fi
