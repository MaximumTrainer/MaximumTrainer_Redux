name: Deploy group-relay Worker

on:
  push:
    branches: [master]
    paths:
      - 'workers/group-relay/**'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Deploy worker
        id: deploy
        working-directory: workers/group-relay
        run: |
          DEPLOY_OUTPUT=$(npx wrangler@4 deploy --config wrangler.toml 2>&1)
          echo "$DEPLOY_OUTPUT"
          WORKER_URL=$(echo "$DEPLOY_OUTPUT" | grep -oE 'https://[^[:space:]]+\.workers\.dev' | head -n1)
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # A new workers.dev route can answer with Cloudflare error 1042 for about
      # a minute after the first deploy, so retry before failing.
      - name: Verify relay end to end
        run: |
          WORKER_URL="${{ steps.deploy.outputs.worker_url }}"
          if [ -z "$WORKER_URL" ]; then
            echo "Could not determine worker URL from wrangler output"; exit 1
          fi
          for attempt in $(seq 1 12); do
            BODY=$(curl -s -m 15 "$WORKER_URL/health" || true)
            echo "health: $BODY"
            case "$BODY" in *'"ok":true'*) break ;; esac
            sleep 10
          done
          case "$BODY" in *'"ok":true'*) ;; *) echo "FAIL - relay not healthy"; exit 1 ;; esac
          node workers/group-relay/test/relay.smoke.mjs "${WORKER_URL/https:/wss:}"
