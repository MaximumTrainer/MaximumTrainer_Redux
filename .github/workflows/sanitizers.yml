name: Sanitizers

# Runs the headless test suites under AddressSanitizer + UndefinedBehaviorSanitizer,
# and clang-tidy (.clang-tidy) over the app sources.
# Standalone (not called from build.yml), so it never gates or slows a release.
on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
    paths-ignore: ['docs/**']
  # Same-repo branches already run via push; pull_request only does work for forks.
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: sanitizers-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  QT_VERSION: '6.11.3'
  QWT_DIR: /tmp/qwt6
  CLANG_TIDY_VERSION: '23.1.4'
  AQT_CONFIG: ${{ github.workspace }}/.github/aqt-settings.ini

jobs:
  asan_ubsan:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      QT_QPA_PLATFORM: offscreen
      ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1:strict_string_checks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Point apt at a reachable Ubuntu mirror
      run: |
        mirrors=""
        for host in mirrors.edge.kernel.org azure.archive.ubuntu.com archive.ubuntu.com; do
          if curl -fsS -o /dev/null -m 10 "http://$host/ubuntu/dists/noble/Release"; then
            mirrors="$mirrors http://$host/ubuntu/"
          fi
        done
        [ -n "$mirrors" ] || mirrors=" http://azure.archive.ubuntu.com/ubuntu/ http://archive.ubuntu.com/ubuntu/"
        # Every mirror that answered, in order: apt's mirror+file method fails over
        # down the list per download, so one dying mid-install no longer fails the job.
        echo "Using:$mirrors"
        printf '%s\n' $mirrors | sudo tee /etc/apt/apt-mirrors.txt
        sudo grep -rl 'azure\.archive\.ubuntu\.com\|//archive\.ubuntu\.com\|//security\.ubuntu\.com' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null \
          | xargs -r sudo sed -i -E "s#https?://(azure\.archive|archive|security)\.ubuntu\.com/ubuntu/?#mirror+file:/etc/apt/apt-mirrors.txt#g" || true
        printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::ForceIPv4 "true";\n' | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'desktop'
        arch: 'linux_gcc_64'
        modules: 'qtwebsockets qtconnectivity'
        cache: true
        cache-key-prefix: qt-linux-san

    - name: Install build dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y libssl-dev ninja-build

    - name: Set up ccache
      uses: hendrikmuhs/ccache-action@v1.2.26
      with:
        key: linux-asan-qt${{ env.QT_VERSION }}
        max-size: 400M
        evict-old-files: job
        job-summary: ccache stats

    - name: Build suites under ASan + UBSan
      run: |
        suites=$(grep -vE '^\s*(#|$)' .github/sanitizer-suites.txt | xargs -n1 basename)
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMT_BUILD_APP=OFF -DMT_SANITIZE="address;undefined" \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        cmake --build build --target $suites

    - name: Run suites under ASan + UBSan
      run: |
        mkdir -p sanitizer-logs
        failed=""
        for name in $(grep -vE '^\s*(#|$)' .github/sanitizer-suites.txt | xargs -n1 basename); do
          echo "::group::$name"
          if ./build/tests/"$name" -v1 > "sanitizer-logs/$name.log" 2>&1; then
            echo "PASS $name"
          else
            echo "::error title=Sanitizer::$name failed (see sanitizer-logs/$name.log)"
            tail -n 80 "sanitizer-logs/$name.log" || true
            failed="$failed $name"
          fi
          echo "::endgroup::"
        done
        if [ -n "$failed" ]; then echo "Failed suites:$failed"; exit 1; fi

    - name: Upload sanitizer logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: sanitizer-logs
        path: sanitizer-logs/
        retention-days: 14

  clang_tidy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Point apt at a reachable Ubuntu mirror
      run: |
        mirrors=""
        for host in mirrors.edge.kernel.org azure.archive.ubuntu.com archive.ubuntu.com; do
          if curl -fsS -o /dev/null -m 10 "http://$host/ubuntu/dists/noble/Release"; then
            mirrors="$mirrors http://$host/ubuntu/"
          fi
        done
        [ -n "$mirrors" ] || mirrors=" http://azure.archive.ubuntu.com/ubuntu/ http://archive.ubuntu.com/ubuntu/"
        # Every mirror that answered, in order: apt's mirror+file method fails over
        # down the list per download, so one dying mid-install no longer fails the job.
        echo "Using:$mirrors"
        printf '%s\n' $mirrors | sudo tee /etc/apt/apt-mirrors.txt
        sudo grep -rl 'azure\.archive\.ubuntu\.com\|//archive\.ubuntu\.com\|//security\.ubuntu\.com' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null \
          | xargs -r sudo sed -i -E "s#https?://(azure\.archive|archive|security)\.ubuntu\.com/ubuntu/?#mirror+file:/etc/apt/apt-mirrors.txt#g" || true
        printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::ForceIPv4 "true";\n' | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'desktop'
        arch: 'linux_gcc_64'
        modules: 'qtwebengine qtconnectivity qtwebchannel qtpositioning qtmultimedia qtwebsockets'
        cache: true
        cache-key-prefix: qt-linux

    - name: Install system dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y libusb-1.0-0-dev libssl-dev libgl1-mesa-dev build-essential ninja-build

    - name: Restore QWT cache
      id: qwt-cache
      uses: actions/cache@v6
      with:
        path: ${{ env.QWT_DIR }}
        key: qwt-6.3.0-qt-${{ env.QT_VERSION }}-linux

    - name: Build and install QWT
      if: steps.qwt-cache.outputs.cache-hit != 'true'
      run: |
        cd /tmp
        curl -L -o qwt.tar.bz2 "https://sourceforge.net/projects/qwt/files/qwt/6.3.0/qwt-6.3.0.tar.bz2/download"
        tar xf qwt.tar.bz2
        cd qwt-6.3.0
        qmake qwt.pro
        make -j$(nproc)
        make install INSTALL_ROOT=/tmp/qwt6-stage
        mkdir -p "$QWT_DIR"
        mv /tmp/qwt6-stage/usr/local/qwt-6.3.0/* "$QWT_DIR"/

    - name: Install clang-tidy
      run: pip install "clang-tidy==${CLANG_TIDY_VERSION}"

    # No ccache: a launcher prefix confuses clang-tidy's driver detection.
    # Building the app generates the moc/uic sources it includes.
    - name: Build and record compile commands
      run: |
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DQWT_INSTALL="$QWT_DIR" -DMT_BUILD_TESTS=OFF
        cmake --build build

    - name: clang-tidy
      run: |
        python3 - <<'PY' > tidy-files.txt
        import json, os
        root = os.getcwd() + "/src/"
        files = {os.path.normpath(os.path.join(e["directory"], e["file"]))
                 for e in json.load(open("build/compile_commands.json"))}
        print("\n".join(sorted(f for f in files
                               if f.startswith(root) and "/src/fitness/fit/" not in f
                               and f.endswith(".cpp"))))
        PY
        count=$(grep -c . tidy-files.txt || true)
        if [ "$count" -lt 100 ]; then echo "::error::only $count source files found in compile_commands.json"; exit 1; fi
        echo "Checking $count files with $(clang-tidy --version | grep -o 'version [0-9.]*')"
        xargs -P "$(nproc)" -n 4 clang-tidy -p build --quiet < tidy-files.txt

  # Line/function coverage of the headless suites (report only, no threshold).
  # Covers the sources those suites compile, not UI-only code.
  coverage:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Point apt at a reachable Ubuntu mirror
      run: |
        mirrors=""
        for host in mirrors.edge.kernel.org azure.archive.ubuntu.com archive.ubuntu.com; do
          if curl -fsS -o /dev/null -m 10 "http://$host/ubuntu/dists/noble/Release"; then
            mirrors="$mirrors http://$host/ubuntu/"
          fi
        done
        [ -n "$mirrors" ] || mirrors=" http://azure.archive.ubuntu.com/ubuntu/ http://archive.ubuntu.com/ubuntu/"
        # Every mirror that answered, in order: apt's mirror+file method fails over
        # down the list per download, so one dying mid-install no longer fails the job.
        echo "Using:$mirrors"
        printf '%s\n' $mirrors | sudo tee /etc/apt/apt-mirrors.txt
        sudo grep -rl 'azure\.archive\.ubuntu\.com\|//archive\.ubuntu\.com\|//security\.ubuntu\.com' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null \
          | xargs -r sudo sed -i -E "s#https?://(azure\.archive|archive|security)\.ubuntu\.com/ubuntu/?#mirror+file:/etc/apt/apt-mirrors.txt#g" || true
        printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::ForceIPv4 "true";\n' | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'desktop'
        arch: 'linux_gcc_64'
        modules: 'qtwebsockets qtconnectivity'
        cache: true
        cache-key-prefix: qt-linux-san

    - name: Install build dependencies and gcovr
      run: |
        sudo apt-get update -y
        sudo apt-get install -y libssl-dev ninja-build
        pip install gcovr==8.8

    - name: Build and run suites with coverage
      run: |
        suites=$(grep -vE '^\s*(#|$)' .github/sanitizer-suites.txt | xargs -n1 basename)
        cmake -S . -B build -G Ninja -DMT_BUILD_APP=OFF -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_CXX_FLAGS="--coverage -O0" -DCMAKE_EXE_LINKER_FLAGS="--coverage"
        cmake --build build --target $suites
        for name in $suites; do
          ./build/tests/"$name" -silent || echo "::warning::$name reported failures (gated by the test jobs)"
        done

    - name: Coverage report
      run: |
        mkdir -p coverage
        common=(--root . --filter 'src/' --exclude 'src/fitness/fit/' --exclude 'build/'
                --gcov-ignore-errors=no_working_dir_found
                --gcov-ignore-parse-errors=negative_hits.warn_once_per_file)
        gcovr "${common[@]}" --html-details coverage/index.html --markdown coverage/summary.md --print-summary
        {
          echo "Headless suites only (sources they compile; UI-only code is not measured)."
          echo
          cat coverage/summary.md
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload coverage report
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: coverage/
        retention-days: 14

